cover:"/30.jpg",m3u8Index:9,title:"徐秘书她蓄谋已久",region:"国产",type:"电影",year:2024,genreRaw:"都市爱情 / 职场逆袭",tags:["国产","电影","爱情","职场","甜宠","爽文","反转"],oneLine:"总裁眼中笨拙的小秘书，实则是隐藏身份的商业奇才，一切接近只为一场精心策划的复仇。",summary:"徐安然是集团总裁顾承泽身边存在感极低的小秘书，做事毛手毛脚，常被训斥。顾承泽只当她是个需要关照的远房亲戚。然而，这一切都是徐安然的伪装。三年前，她的家族企业被顾承泽的父亲用不正当手段逼至破产，父亲含恨而终。她改头换面，精心设计进入顾氏，从底层一步步接近核心。她暗中收集证据，并利用自己的金融天赋，在顾承泽的几次商业危机中，以“巧合”的方式给出关键提示，既获取信任，又搅动风云。当复仇计划即将收网，她却发现自己对这位正直却孤独的总裁产生了不该有的感情。",review:"设定带感，女主“扮猪吃老虎”的设定满足爽点。剧情节奏张弛有度，职场线与感情线交织紧密。男女主互动从单方面“狩猎”到双向心动，过程细腻。最后的反转与抉择处理得不落俗套，兼顾了戏剧冲突与情感深度。",relatedIds:[51,99,60,56,88,36],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"},{id:31,cover:"/31.jpg",m3u8Index:10,title:"吃吧，让爱重来",region:"国产",type:"电影",year:2018,genreRaw:"美食治愈 / 家庭情感",tags:["国产","电影","美食","家庭","治愈","亲情","温馨"],oneLine:"失去味觉的天才厨师，回到家乡继承破旧食堂，用记忆中的味道寻回亲情与自我。",summary:"林夏是餐饮界炙手可热的天才主厨，却因过度追求创新和一场意外，患上了心因性味觉失灵。事业跌入谷底时，她得知在老家的父亲中风，经营的家常菜食堂面临关闭。林夏被迫回到阔别多年的小镇，接手食堂。面对父亲的沉默、老街坊的质疑，以及自己尝不出味道的绝望，她只能凭着童年记忆和对父亲手艺的模糊印象，尝试复刻那些最简单的家常菜。在烹饪的过程中，她与父亲疏远的过往、母亲早逝的遗憾逐渐浮现。当一道被遗忘的、母亲留下的“秘方”被重新发现，林夏的味觉与封存的情感，一同苏醒。",review:"影片将美食与情感结合得极为巧妙，每一道菜都承载着一段记忆与情感。画面温暖，食物镜头令人垂涎。故事娓娓道来，没有激烈冲突，却在平淡日常中蕴含巨大情感力量。关于传承、理解与和解的主题，触动人心。",relatedIds:[75,30,43,14,10,73],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/a27121d514ff0079e1e81a6678f14e0c/manifest/video.m3u8"},{id:32,cover:"/32.jpg",m3u8Index:11,title:"她与拳锋",region:"国产",type:"电影",year:2022,genreRaw:"运动励志 / 女性剧情",tags:["国产","电影","拳击","女性","励志","成长","热血"],oneLine:"37岁的单亲妈妈，为了女儿的治疗费和自我救赎，毅然踏上残酷的职业拳击擂台。",summary:"陈默，37岁，超市理货员，独自抚养患有先天性心脏病的女儿。生活被账单和疲惫填满。一次偶然，她发现自己竟有拳击天赋。为了赚取高昂的手术费，也为了打破如死水般的生活，她瞒着女儿，偷偷加入一个地下拳击俱乐部，接受前拳王老吴的魔鬼训练。从体能到技巧，从害怕挨打到学会反击，伤痕成为她的勋章。她不仅要面对年轻对手的轻视、身体的极限，还要平衡工作、照顾女儿和训练。当她终于站上正式比赛的擂台，聚光灯下，她的对手不仅仅是眼前的强敌，更是命运和生活施加给她的所有重压。",review:"这是一部真正意义上的女性力量之作。没有刻意煽情，用写实甚至粗粝的镜头展现了一个母亲为爱拼搏的坚韧。拳击场面真实激烈，情感内核厚重温暖。女主角的表演极具颠覆性，从卑微到强大的转变令人信服且动容。",relatedIds:[95,4,31,51,58,30],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/f0d38b8679a1231eff816a8e04cc1a0c/manifest/video.m3u8"},{id:33,cover:"/33.jpg",m3u8Index:12,title:"突击莉莉",region:"日韩",type:"电影",year:2021,genreRaw:"科幻动作 / 校园战斗",tags:["日韩","电影","科幻","动作","校园","美少女","机甲"],oneLine:"少女们装备神秘武器，在看似普通的校园里，为守护世界而与无形之敌战斗。",summary:"近未来，世界各地偶尔会出现名为“Huge”的神秘能量生命体，常规武器对其无效。唯有特殊体质、被称为“莉莉”的少女，通过装备结合科技与魔法的“CHARM”武器才能与之对抗。故事发生在专门培养莉莉的“百合丘女学院”。新生一叶满怀憧憬入学，却发现战斗训练异常残酷，而身边的同学各怀秘密。在一次实战中，她所在的小队遭遇了前所未有的强大Huge，并发现了敌人与学院历史之间隐藏的关联。少女们必须在维系日常校园生活的同时，背负起守护世界的重任，并在战斗中寻找自身存在的意义。",review:"将美少女、校园与硬核机甲战斗元素融合得十分出色。动作设计流畅华丽，特效精良。在战斗主线外，对少女间细腻的情感羁绊刻画到位，形成了“既燃又治愈”的独特观感。世界观设定虽复杂但逐步展开，引人入胜。",relatedIds:[74,61,12,60,2,16],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c66b5309b3b64d15ed856810d6cc0b72/manifest/video.m3u8"},{id:34,cover:"/34.jpg",m3u8Index:13,title:"阿佤山",region:"国产",type:"电影",year:2008,genreRaw:"乡村剧情 / 民族音乐",tags:["国产","电影","乡村","民族","音乐","传承","人文"],oneLine:"音乐采风青年深入云南佤寨，与守护古歌的少女相遇，共同面临现代文明对传统的冲击。",summary:"音乐学院研究生杨帆为完成关于少数民族古歌的论文，独自前往云南深处的阿佤山。他结识了能唱诵所有佤族古歌的少女叶娜和她的爷爷——最后一位“魔巴”（祭司）。杨帆被古老、苍凉又充满生命力的歌声震撼，决心用现代设备记录下来。然而，寨子里的年轻人纷纷外出务工，对传统失去兴趣，开发商也看中了这里的旅游资源。叶娜的爷爷病重，古歌面临失传。杨帆和叶娜在记录与保护的过程中互生情愫，但他们必须一起面对的是：是让古歌作为“标本”封存，还是让它以新的形式活下去？他们的选择将影响整个佤寨的未来。",review:"影片如一首流淌的视觉诗歌，画面壮美，原生态的佤族音乐直击灵魂。故事平静中蕴含力量，深刻探讨了文化传承与发展的永恒命题。男女主角的情感含蓄而真挚，与山水人文浑然一体，展现了超越爱情的精神共鸣。",relatedIds:[56,35,64,3,22,54],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c99d86ece73a935b77e57d322461ddb5/manifest/video.m3u8"},{id:35,cover:"/35.jpg",m3u8Index:14,title:"素人特工",region:"国产",type:"电影",year:2017,genreRaw:"动作喜剧 / 冒险",tags:["国产","电影","动作","喜剧","冒险","特工","草根逆袭"],oneLine:"四个身怀绝技的普通人，阴差阳错卷入国际阴谋，被迫组成菜鸟特工队拯救世界。",summary:"极限运动网红大葱、过气魔术师阿灿、记忆力超强的宅男数据员KK，以及脾气火爆的女保安春花，四人各自在布达佩斯旅游时，因巧合被误认为是某个已覆灭的特工组织成员，卷入一场针对全球金融系统的犯罪阴谋。被迫成为“临时特工”的他们，在真正的王牌特工“冰人”的远程指导下，利用各自的奇葩技能——跑酷、障眼法、过目不忘和天生神力——在异国他乡展开逃亡与反击。从手忙脚乱到默契配合，这群乌合之众在笑料百出的任务中，竟意外戳破了敌人的惊天计划。",review:"娱乐性极强的爆米花电影，动作场面设计新颖，巧妙融合了主角们的“不专业”技能，笑点密集。角色设定有趣，每个“素人”都有闪光点。剧情轻松流畅，不乏刺激的追逐和打斗，是解压放松的优选。",relatedIds:[32,27,70,15,61,71],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fe0c41d994d01211debb24e84e3384a9/manifest/video.m3u8"},{id:36,cover:"/36.jpg",m3u8Index:15,title:"疯批侯门重生现代",region:"国产",type:"电影",year:2024,genreRaw:"穿越重生 / 都市商战",tags:["国产","电影","穿越","重生","商战","复仇","爽文","大女主"],oneLine:"宅斗失败的侯府疯批嫡女，重生为现代豪门受气包，用古代权谋术玩转现代商界。",summary:"侯府嫡女沈惊澜，精通权谋却遭亲人陷害，含恨而终。再睁眼，她成了21世纪豪门沈家懦弱无能、备受欺凌的养女沈澜。面对想侵吞家产的叔伯、绿茶姐妹和冷漠的父亲，沈惊澜的灵魂冷笑一声。她将深宅大院里的御下、制衡、攻心之术，灵活运用于现代职场与家族斗争中。谈笑间设局，让对手自食其果；用古董鉴赏知识震惊业界；甚至以兵法理念进行商业并购。当她以铁腕手段掌控集团，所有仇人匍匐脚下时，那个一直冷眼旁观、身份神秘的执行总裁陆瑾舟，却道破了她的来历：“夫人，这一世，玩得可尽兴？”",review:"设定新奇有趣，“降维打击”的爽感贯穿始终。女主智商在线，杀伐果断，观感极度舒适。古今思维碰撞产生不少笑点和亮点。权谋戏写得颇有水平，商战情节不儿戏。感情线作为调剂，神秘男主的设定增添了悬念。",relatedIds:[77,66,39,49,82,3],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/929fdb8e536c1fc43a83b32d1a838547/manifest/video.m3u8"},{id:37,cover:"/37.jpg",m3u8Index:16,title:"搏忆",region:"欧美",type:"电影",year:2015,genreRaw:"科幻悬疑 / 心理惊悚",tags:["欧美","电影","科幻","悬疑","惊悚","记忆","意识"],oneLine:"记忆提取专家调查一桩凶案，却在死者记忆深处，发现了属于自己的犯罪片段。",summary:"在近未来，记忆可以被提取并可视化。顶尖“记忆侦探”科尔受雇调查一位富豪的离奇死亡。他进入死者最后48小时的记忆回廊，搜寻线索。记忆世界光怪陆离，充满隐喻和扭曲。随着调查深入，科尔发现死者与自己似乎存在不为人知的交集。更可怕的是，他在记忆深处的一个角落，清晰地“看”到了自己杀害死者的画面。是记忆被篡改？是有人植入？还是自己潜意识的罪恶投射？科尔陷入自我怀疑与恐慌，他必须赶在警方之前，厘清记忆与现实的边界，找出真相，否则他将成为头号嫌疑人。",review:"概念惊艳，关于记忆真实性的探讨引人深思。影片营造了出色的悬疑和 paranoid（偏执）氛围，观众跟随主角一起在虚实之间迷失。视觉效果独特，记忆世界的呈现方式充满想象力。结局的多重反转，将主题升华到对身份本质的追问。",relatedIds:[34,32,15,36,77,20],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fbc04ae173a0e633458658e80ee78c2a/manifest/video.m3u8"},{id:38,cover:"/38.jpg",m3u8Index:17,title:"黄昏的优作",region:"日韩",type:"电影",year:2011,genreRaw:"家庭剧情 / 人生传记",tags:["日韩","电影","家庭","剧情","人生","温情","老年"],oneLine:"退休的普通公司职员优作，在人生黄昏时，开始用录音机记录自己平凡却独特的一生。",summary:"70岁的山田优作退休了，生活突然失去了重心。在整理旧物时，他找到一台老式录音机，萌生了给自己录“自传”的念头。对着话筒，他从战后的童年、平凡的恋爱、工作的艰辛、儿子的出生与疏远、妻子的病逝……一点一滴地回忆。录音的过程，也是他重新审视自己人生的过程。那些他曾以为的遗憾、平庸和沉默，在回忆的滤镜下，呈现出不同的意义。儿子无意中听到了部分录音，父子间冰封的关系开始悄然融化。优作的故事，最终不仅是一部私人史，更成为了一面镜子，映照出一个时代普通人的生命轨迹。",review:"影片节奏舒缓如黄昏的日光，充满静谧的力量。它摒弃了戏剧性，专注于挖掘日常生活的诗意与深刻。男主角的表演炉火纯青，每一道皱纹里都是故事。它让人思考，所谓平凡的人生，是否本身就蕴含着最伟大的叙事。",relatedIds:[63,29,81,60,91,79],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/0ba4f146b0e6ea192526706f495d460f/manifest/video.m3u8"},{id:39,cover:"/39.jpg",m3u8Index:18,title:"你曾是我的亿万星辰",region:"国产",type:"电影",year:2020,genreRaw:"都市爱情 / 虐恋剧情",tags:["国产","电影","爱情","虐恋","破镜重圆","误会","深情"],oneLine:"她为他顶罪入狱五年，出狱后他却已成商业巨头，且身边另有佳人，对她冷若冰霜。",summary:"林晚星曾是天之娇女，却因深爱顾辰，甘愿替他顶下商业过失罪，被判入狱五年。狱中，她收到顾辰决绝的分手信。五年后，她孑然一身出狱，顾辰已是叱咤风云的科技新贵，并有门当户对的未婚妻。他视她如陌路，甚至带着报复般的冷酷，在商业上打压她艰难起步的小工作室。林晚星心死如灰，决定彻底告别过去。然而，当她身陷险境，顾辰却不顾一切前来相救。重伤昏迷前，她听到他痛苦的呓语，才发现当年那封分手信背后的惨烈真相，以及他暗中为她所做的一切。",review:"狗血虐恋的设定被演绎得极具张力，前期误会带来的压抑感十足，后期真相揭开时的情感爆发力很强。演员情绪把控到位，从隐忍到绝望再到释然，层次分明。虽然套路明显，但情感浓度高，能精准戳中特定观众的泪点。",relatedIds:[88,13,100,68,21,49],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1e53f0e1aef7ec2fb5f30ef5d309d69c/manifest/video.m3u8"},{id:40,cover:"/40.jpg",m3u8Index:19,title:"鬼灭之刃 无限列车篇",region:"日韩",type:"电影",year:2020,genreRaw:"奇幻战斗 / 热血冒险",tags:["日韩","电影","动画","热血","战斗","奇幻","催泪","神作"],oneLine:"灶门炭治郎与炎柱炼狱杏寿郎登上无限列车，与潜伏的梦魇之鬼展开生死决战。",summary:"在消灭蜘蛛山的鬼后，炭治郎、祢豆子、善逸和伊之助接到新的任务，与鬼杀队最强的“柱”之一——炎柱炼狱杏寿郎汇合，调查多人失踪的无限列车事件。他们登上列车后，很快遭遇了下弦之壹·魇梦的血鬼术袭击。魇梦能让乘客陷入无法醒来的幸福梦境，并在梦中摧毁其精神核心。炭治郎等人必须在梦中保持自我意识并苏醒。当他们艰难战胜魇梦，真正的强敌——上弦之叁·猗窝座突然现身。为了保护全车乘客，炎柱炼狱杏寿郎独自迎战，展开了一场惊天动地、燃烧生命的最终对决。",review:"电影版在TV版超高水准上再次突破。作画、分镜、特效达到剧场版动画的顶级水平，战斗场面兼具速度、力量与美感，堪称视觉盛宴。文戏情感铺垫厚重，炎柱的角色塑造极其成功，其牺牲场面成为动画史上最催泪的片段之一，将热血与奉献精神升华到新的高度。",relatedIds:[16,96,21,27,50,80],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1116997bf50b78f22bbfaced8975a021/manifest/video.m3u8"},{id:41,cover:"/41.jpg",m3u8Index:0,title:"姐姐，弟弟教你谈恋爱",region:"国产",type:"电影",year:2023,genreRaw:"青春喜剧 / 校园爱情",tags:["国产","电影","青春","喜剧","校园","爱情","姐弟","搞笑"],oneLine:"恋爱经验为零的姐姐，为完成论文研究，被迫接受情场高手弟弟的“魔鬼恋爱特训”。",summary:"心理学研究生林知夏，论文课题是“当代大学生恋爱行为模式”，但她本人却是母胎单身，对恋爱一窍不通。无奈之下，她“雇佣”自己那个换女友如换衣服、号称“情圣”的弟弟林冬冬当“教练”。于是，一系列令人捧腹的特训开始了：从穿搭改造、聊天话术，到约会情景模拟。弟弟甚至带她去现场观摩自己的约会（当然是以路人身份）。过程中笑料百出，姐弟俩斗智斗勇。然而，当林知夏在弟弟的“指导”下，意外吸引了弟弟最好的兄弟、篮球队长周叙时，这场教学开始变得混乱而复杂，姐弟关系也面临全新考验。",review:"轻松下饭的校园喜剧，姐弟互怼日常真实又搞笑。将学术研究和恋爱实践结合的想法很有趣。青春气息扑面而来，配角团也各有特色。感情线发展自然甜蜜，最后关于亲情与爱情、成长与自我的探讨，为电影增添了暖色。",relatedIds:[13,62,7,32,10,56],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e398cb38b257828eeedbcaa0ae2856da/manifest/video.m3u8"},{id:42,cover:"/42.jpg",m3u8Index:1,title:"大秦帝师",region:"国产",type:"电影",year:2003,genreRaw:"历史剧情 / 古装权谋",tags:["国产","电影","历史","权谋","古装","战国","师徒"],oneLine:"一位神秘智者入秦，辅佐少年嬴政，以超越时代的智慧与谋略，奠定统一六国的基础。",summary:"战国末年，秦国虽强，但内有权臣掣肘，外有六国合纵。一位自称“鬼谷”的年轻士子韩非（化名）来到咸阳，以惊人的学识与魄力，逐渐获得年幼秦王嬴政的信任与依赖。他并非教授经史子集，而是传授地理、经济、制度、外交乃至基础的物理化学知识，用超越时代的思想启蒙嬴政。同时，他帮助嬴政挫败嫪毐叛乱，设计扳倒权相吕不韦，改革军制，远交近攻。然而，韩非的真实身份和目的始终成谜。他似乎在推动历史，又似乎想改变什么。当嬴政即将亲政，韩非的使命也到了终局，他的选择将影响帝国的走向。",review:"气势恢宏的历史正剧风格，考据严谨，台词精炼。对战国末期政治斗争的刻画波澜壮阔。师徒关系的塑造尤其出色，亦师亦友亦臣，充满张力与智慧碰撞。影片成功塑造了一个理想化的“帝师”形象，其思想的光芒穿越时空。",relatedIds:[51,19,53,20,12,81],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:43,cover:"/43.jpg",m3u8Index:2,title:"7分钟",region:"欧美",type:"电影",year:2016,genreRaw:"犯罪惊悚 / 高概念剧情",tags:["欧美","电影","惊悚","犯罪","高概念","限时","反转"],oneLine:"一次银行抢劫必须在7分钟内完成，每过一分钟，就有一个同伙的亲人被杀死。",summary:"走投无路的杰克被一个神秘组织胁迫，参与一桩极其精确的银行劫案。组织头目“钟表匠”在杰克的耳朵里植入通讯器，并绑架了他的妻女。规则残酷：抢劫必须在7分钟内完成。每超过一分钟，组织就会杀死一名参与劫案者的亲人。杰克的同伙们也都受此威胁。他们被迫以难以置信的效率行动，但计划总是赶不上变化：突然出现的保安、顽固的银行经理、意想不到的警铃……时间一分一秒流逝，紧张感几乎令人窒息。当终于拿到钱，时间却已所剩无几。而此时，杰克发现了这场“7分钟游戏”背后更加黑暗和复杂的真相。",review:"影片设定极具创意，将时间压力推向极致，全程紧绷，悬念迭起。节奏控制堪称典范，分秒必争的压迫感让观众身临其境。角色在极限状态下的抉择引人深思。结局的多重反转，将简单的抢劫案提升到人性与救赎的层面，余味悠长。",relatedIds:[84,89,96,52,95,28],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:44,cover:"/44.jpg",m3u8Index:3,title:"为老婆赚手术费我拼了",region:"国产",type:"电影",year:2022,genreRaw:"现实励志 / 温情喜剧",tags:["国产","电影","励志","温情","喜剧","现实","爱情","小人物"],oneLine:"外卖员老张为筹齐妻子心脏手术的巨额费用，同时打五份工，引发一连串悲喜交加的故事。",summary:"45岁的外卖员张建国，妻子阿珍突发心脏病，急需30万手术费。面对天文数字，老张没有退缩。他卖掉老家房子，仍差一大截。于是，他开始了疯狂的“兼职”生活：白天送外卖、晚上代驾、凌晨去海鲜市场搬运、周末做装修零工，甚至偷偷去当药物试验的志愿者。身体的极度疲惫和一次次筹钱受挫几乎压垮他，但回家看到妻子强撑的笑脸，他又充满力量。他的事迹被同事和顾客偶然拍下，在网络上引发关注。善意与误解同时涌来。在手术前夕，一笔意外的匿名捐款解决了所有问题，而捐款人的身份，让老张和所有人泪流满面。",review:"扎根于现实的温暖故事，没有刻意卖惨，反而充满坚韧的亮色。男主角的表演朴实无华却极具感染力，完美诠释了小人物如山般的责任感。笑中带泪，悲喜交织，对普通人的互助与善良刻画得真挚动人，是一部治愈心灵的作品。",relatedIds:[59,82,95,5,26,16],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:45,cover:"/45.jpg",m3u8Index:4,title:"丧尸未逝",region:"欧美",type:"电影",year:2019,genreRaw:"丧尸喜剧 / 社会讽喻",tags:["欧美","电影","丧尸","喜剧","讽刺","冷幽默","独立电影"],oneLine:"丧尸危机悄然降临小镇，但镇民们的反应平淡得出奇，照常喝咖啡、聊八卦、处理尸体。",summary:"在美国一个宁静到近乎沉闷的小镇，丧尸危机毫无征兆地爆发了。然而，与通常的末日恐慌不同，镇上的警察、咖啡店老板、农场主、青少年们，都对蹒跚而来的丧尸表现出一种诡异的漠然和适应。他们一边用各种工具（从电锯到高尔夫球杆）处理丧尸，一边继续讨论着镇上的琐事、新开的汉堡店、以及明星八卦。影片跟随两个看透一切的警察，以极其冷静甚至死板的视角，观察这个小镇如何在日常节奏中，“消化”这场超现实的灾难。直到他们发现，这场危机的源头，可能与小镇本身一个深埋的秘密有关。",review:"导演吉姆·贾木许独特的作者风格浓郁，将丧尸类型片拍成了充满冷幽默和存在主义思考的社会寓言。台词精妙，表演内敛而荒诞。它讽刺了现代人对一切灾难的麻木和消费主义心态，是献给影迷的一部另类、智慧且有趣的丧尸片。",relatedIds:[7,84,33,93,94,17],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:46,cover:"/46.jpg",m3u8Index:5,title:"草原大作战",region:"国产",type:"电影",year:2021,genreRaw:"动画冒险 / 合家欢喜剧",tags:["国产","电影","动画","冒险","喜剧","动物","合家欢","草原"],oneLine:"一只梦想成为“草原第一勇士”的绵羊，必须团结天敌与伙伴，对抗外来的破坏者。",summary:"在美丽的呼伦贝尔草原上，绵羊家族世代过着平静生活。年轻气盛的公羊“闪电”不甘平庸，梦想成为像狼一样被尊敬的勇士。一天，一群开着巨型机械、意图将草原改造成矿场的外来者入侵，破坏了家园。草原动物们各自为战，节节败退。关键时刻，闪电提出摒弃成见，联合所有草原居民——包括世仇的狼群、高傲的鹰、胆小的旱獭——共同对敌。它们利用动物的特长，制定了一系列令人啼笑皆非又效果奇佳的“作战计划”。在一场场妙趣横生的“战役”中，闪电明白了真正的勇气在于守护与团结，而非个人英雄主义。",review:"画面精美，草原风光令人心旷神怡。动物角色设计可爱，性格鲜明。故事简单但主题积极向上，巧妙传递了环保与民族团结的理念。动作场面富有创意，笑点适合全年龄段，是一部制作精良、寓教于乐的国产动画佳作。",relatedIds:[90,63,48,87,22,73],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:47,cover:"/47.jpg",m3u8Index:6,title:"重组家庭",region:"国产",type:"电影",year:2014,genreRaw:"家庭喜剧 / 温情剧情",tags:["国产","电影","家庭","喜剧","温情","重组家庭","成长"],oneLine:"一对中年男女带着各自“难搞”的儿女再婚，四个陌生人被迫在同一屋檐下学习成为家人。",summary:"厨师老周和会计李梅通过相亲认识，各自带着一个青春期的孩子决定再婚。老周的儿子周晓东是个沉迷游戏的宅男，李梅的女儿苏小雨是个敏感叛逆的艺考生。新家第一天，两人就划清界限，互不搭理。老周和李梅为了维系这个新家绞尽脑汁，闹出不少笑话。从共用卫生间的时间大战，到口味不同的饭菜之争，四个人的磨合充满火药味。直到李梅遭遇职场不公，老周挺身而出；晓东被同学欺负，小雨用她的方式帮他解围。一点一滴的危机与温暖，让横亘在四人之间的冰墙慢慢融化。他们发现，家人或许不是从天而降的，而是共同“创造”出来的。",review:"影片真实细腻地刻画了重组家庭面临的琐碎挑战与情感困境，代入感强。喜剧包袱源于生活，自然不做作。小演员的表演尤其出色，将青春期孩子的别扭与善良演绎得淋漓尽致。故事温暖治愈，强调了“选择”和“经营”在家庭关系中的重要性。",relatedIds:[70,90,55,85,54,84],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/86ea18f9954dbaf22eff5e16c41b4a25/manifest/video.m3u8"},{id:48,cover:"/48.jpg",m3u8Index:7,title:"那年时光安好",region:"国产",type:"电影",year:2018,genreRaw:"青春 / 校园 / 爱情",tags:["国产","电影","青春","校园","怀旧","成长"],oneLine:"五个高中好友在千禧年初许下约定，二十年后重聚却发现早已物是人非。",summary:"2003年夏末，即将各奔东西的五位好友在校园天台约定，无论未来如何，二十年后都要回到这里重聚。镜头切换至2023年，有人成了精明的商人，有人被生活磨平棱角，有人始终在为梦想挣扎。当年的秘密与情愫在重聚之夜被一一揭开，欢笑与泪水交织中，他们终于明白，真正安好的并非时光本身，而是那份敢于直面过去与现在的勇气。影片通过双时间线叙事，细腻描绘了友情在岁月中的变迁与永恒。",review:"影片节奏舒缓却充满张力，将怀旧情绪处理得恰到好处，没有沉溺于感伤。双线叙事清晰流畅，演员表演自然真挚，尤其是中年戏份，将那种“欲说还休”的复杂心境刻画得入木三分，极易引发同龄观众共鸣。",relatedIds:[89,57,35,93,15,14],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/2df81e778442675885257ce3e84c7173/manifest/video.m3u8"},{id:49,cover:"/49.jpg",m3u8Index:8,title:"冷燕飘零",region:"国产",type:"电影",year:2022,genreRaw:"武侠 / 剧情 / 古装",tags:["国产","电影","武侠","江湖","女性","复仇"],oneLine:"前朝女刺客隐姓埋名，却因一把遗失的冷燕镖被卷入新的江湖风暴。",summary:"江湖第一女刺客“冷燕”在执行最后一次任务后金盆洗手，隐居江南小镇。十年后，一具尸体旁出现的独门暗器“冷燕镖”，让各方势力再度将目光投向这个看似普通的绣娘。为自证清白，也为了保护收养的孤儿，她不得不重拾旧技，对抗来自朝廷、仇家以及昔日同门的追捕。在调查中，她发现这竟是一个针对她的巨大阴谋，而幕后黑手的身份令她心碎。最终，她在飘零与守护之间做出了自己的抉择。",review:"武侠外壳下包裹着动人的女性成长史诗。动作设计飘逸凌厉，充满美感。故事层层递进，反转出人意料又合乎情理。女主角从冷漠杀手到有血有肉的母亲，角色弧光完整，情感冲击力强。",relatedIds:[12,98,97,90,1,34],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/af3d3f3b4940cee04efcd8ff2c9eef0a/manifest/video.m3u8"},{id:50,cover:"/50.jpg",m3u8Index:9,title:"笑面神探",region:"日韩",type:"电影",year:2019,genreRaw:"喜剧 / 悬疑 / 犯罪",tags:["日韩","电影","喜剧","悬疑","侦探","反差萌"],oneLine:"一个总在傻笑的便利店店员，竟是屡破奇案的民间天才侦探。",summary:"在所有人眼中，佐藤阳太是个整天挂着无害笑容、反应迟钝的便利店夜班店员。然而，每当城市发生离奇案件，警方束手无策时，他总能在不经意间指出关键。新调来的刑警美雪起初对他不屑一顾，直到一次绑架案中，阳太通过嫌犯购买的食物和收银小票的细微痕迹，准确推理出藏匿地点。两人组成奇葩搭档，一个用逻辑与观察力破解谜题，一个用职权与行动力实施抓捕。他们共同面对的最终谜案，却与阳太始终微笑的秘密过往息息相关。",review:"设定新颖有趣，喜剧与悬疑元素平衡得极好。男主角“笑面”之下的悲情过往是全片的情感锚点。案件设计巧妙，推理过程扎实且不乏幽默细节，是一部让人笑着感动的另类侦探片。",relatedIds:[78,66,32,71,49,23],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"},{id:51,cover:"/51.jpg",m3u8Index:10,title:"各取所需",region:"欧美",type:"电影",year:2023,genreRaw:"剧情 / 黑色幽默 / 群像",tags:["欧美","电影","黑色幽默","多线叙事","都市","人性"],oneLine:"一次离奇的网络悬赏，让七位陌生人的命运在24小时内疯狂交织。",summary:"一个名为“各取所需”的暗网悬赏平台发布任务：参与者需在24小时内，从指定目标处取得一件无关紧要的物品，即可获得百万奖金。七位背景迥异、各怀欲望的都市男女接受了任务。他们不知道的是，彼此的目标相互关联，形成了一个闭环。于是，律师偷了流浪汉的帽子，流浪汉拿走了主妇的婚戒，主妇取走了学生的论文……一场荒诞的城市追逐悄然上演。当24小时截止，他们才发现，悬赏本身是一个社会实验，而他们付出的代价远非金钱可以衡量。",review:"多线叙事结构精巧绝伦，如同精密齿轮般环环相扣。影片以极致的荒诞讽刺现代人的空虚与欲望，对白犀利，节奏紧凑。结局的反转将主题升华，引人深思。",relatedIds:[63,97,81,50,21,82],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/a27121d514ff0079e1e81a6678f14e0c/manifest/video.m3u8"},{id:52,cover:"/52.jpg",m3u8Index:11,title:"2024天津卫视相声春晚",region:"国产",type:"电影",year:2024,genreRaw:"喜剧 / 家庭 / 剧情",tags:["国产","电影","喜剧","家庭","相声","温情"],oneLine:"一个传统相声世家，为筹备卫视春晚节目，上演了一场笑泪交织的家庭内部“比武”。",summary:"德高望重的相声老艺术家马老爷子，接到天津卫视春晚的邀请，希望他能率家族成员打造一个体现“相声传承”的节目。然而，家族内部矛盾暗涌：大儿子坚守传统，认为流量为王；女儿是脱口秀演员，想融合新潮元素；小孙子则是短视频网红，一心搞怪。筹备过程笑料百出，从剧本创作到排练，代际冲突与理念碰撞不断。就在录制前夜，一场意外让所有人放下成见，最终在春晚舞台上，他们用一场既传统又新颖、充满真挚亲情的表演，打动了所有观众。",review:"将相声艺术与家庭情感故事巧妙结合，笑点密集且接地气，情感真挚动人。生动展现了传统文化在当代面临的挑战与机遇，是一部充满年味和温情的合家欢电影。",relatedIds:[60,64,38,9,77,2],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/f0d38b8679a1231eff816a8e04cc1a0c/manifest/video.m3u8"},{id:53,cover:"/53.jpg",m3u8Index:12,title:"安乐医师",region:"欧美",type:"电影",year:2021,genreRaw:"剧情 / 剧情 / 悬疑",tags:["欧美","电影","剧情","剧情","悬疑","人性挣扎"],oneLine:"一位专为绝症患者实施安乐死的医生，某天接待了一位声称“被治愈”的前客户。",summary:"亨利是一位备受争议的“安乐医师”，他严格筛选申请者，为他们提供有尊严的终结。某天，一位名叫艾拉的女人找上门，声称三年前曾通过亨利“安排”了患有罕见病的自己，但她在最后一刻被秘密医疗项目所救，如今已痊愈。艾拉的出现动摇了亨利的信念，更可怕的是，她开始暗示亨利过去的某些案例并非出于完全自愿。在艾拉的引导和内心道德的驱使下，亨利开始暗中调查自己合作过的医疗中介，逐渐揭开一个关于生命、金钱与欺骗的黑暗网络。",review:"题材大胆深刻，直面生死剧情。氛围营造出色，悬疑感贯穿始终。男主角的表演极具层次，将道德挣扎与职业信念的崩塌过程演绎得扣人心弦，结局令人震撼且回味无穷。",relatedIds:[81,77,32,35,29,14],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c66b5309b3b64d15ed856810d6cc0b72/manifest/video.m3u8"},{id:54,cover:"/54.jpg",m3u8Index:13,title:"霍先生心上人能掐会算",region:"国产",type:"电影",year:2025,genreRaw:"爱情 / 奇幻 / 喜剧",tags:["国产","电影","奇幻","爱情","喜剧","命理"],oneLine:"高冷总裁为破家族诅咒，找上一位号称能算姻缘的迷糊算命师。",summary:"霍氏集团继承人霍临风身负家族诅咒：三十岁前若不找到真爱并结婚，将遭遇大劫。迫近 deadline 的他，病急乱投医找到了巷子里口碑奇特的算命师苏念。苏念算命全靠一本祖传残卷和连蒙带猜，竟算出霍临风的“真命天女”远在天边近在眼前——就是她自己！为了验证并化解诅咒，不信命的霍先生与半吊子苏大师开始了啼笑皆非的“契约恋爱”。在应对家族压力和商业对手的过程中，假的渐渐成了真的，而诅咒的真相也出乎所有人的意料。",review:"轻松浪漫的甜宠剧设定，加入了奇幻和喜剧元素，观感愉悦。男女主角化学反应十足，互动有趣。故事在套路中又有新意，关于“命运”与“选择”的主题探讨为影片增添了几分深度。",relatedIds:[55,4,87,22,80,40],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c99d86ece73a935b77e57d322461ddb5/manifest/video.m3u8"},{id:55,cover:"/55.jpg",m3u8Index:14,title:"我打造了纳米光刻机",region:"国产",type:"电影",year:2023,genreRaw:"剧情 / 科幻 / 励志",tags:["国产","电影","科幻","励志","硬核","工业"],oneLine:"一名技校毕业的机床工人，立志在自家车库造出顶级光刻机。",summary:"张伟，一名普通的数控机床工人，在目睹公司因国外技术封锁而陷入困境后，萌生了一个疯狂的念头：自己造一台纳米级光刻机。只有技校学历的他，利用业余时间自学量子物理、微电子和材料学，将自家的车库改造成简陋实验室。过程屡战屡败，耗尽积蓄，家人不解，同行嘲笑。在几乎放弃时，他结识了退休的物理学家老陈和黑客天才少女小雅，三人组成“破烂联盟”。他们用智慧和土法炼钢，绕过重重专利壁垒，最终在车库中，让一束极紫外光，成功刻出了第一个纳米级晶体管。",review:"中国版的“车库创业”传奇，充满硬核的工业浪漫与草根智慧。影片对技术细节的呈现相当考究，情感真挚，将个人理想与家国情怀自然融合，燃点与泪点并存，极具感染力。",relatedIds:[57,89,48,29,61,71],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fe0c41d994d01211debb24e84e3384a9/manifest/video.m3u8"},{id:56,cover:"/56.jpg",m3u8Index:15,title:"人狗奇缘",region:"日韩",type:"电影",year:2008,genreRaw:"剧情 / 家庭 / 冒险",tags:["日韩","电影","治愈","冒险","宠物","温情"],oneLine:"一只走失的秋田犬，跨越四百公里风雪，只为回到小主人身边。",summary:"小学生小亮在冬天收养了流浪秋田犬“大风”。一年后，小亮因父亲工作调动，不得不举家迁往遥远的北海道。在搬家途中，大风意外走失。它凭着模糊的记忆和本能，踏上了长达四百公里的回家之路。途中，它遇到过善良的货车司机，躲避过捕狗队的追捕，与野狗群争斗，也帮助过迷路的登山者。另一边，小亮因思念大风郁郁寡欢，坚信大风会回来。整整一个冬季过去，当瘦骨嶙峋、伤痕累累的大风奇迹般地出现在小亮新家的门口时，所有人都为之动容。",review:"经典的人宠情感佳作，叙事平实却极具穿透力。从狗狗的视角展现旅程，艰难险阻中闪烁着动物的忠诚与灵性。画面优美，情感克制而浓烈，足以让任何铁石心肠的观众潸然泪下。",relatedIds:[70,97,23,17,82,24],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/929fdb8e536c1fc43a83b32d1a838547/manifest/video.m3u8"},{id:57,cover:"/57.jpg",m3u8Index:16,title:"去桃花盛开的地方",region:"国产",type:"电影",year:2020,genreRaw:"爱情 / 乡村 / 治愈",tags:["国产","电影","爱情","乡村","治愈","田园"],oneLine:"失恋又失业的都市白领，在偏远桃花村找到了爱情与人生的新可能。",summary:"林悦在遭遇男友背叛和公司裁员的双重打击后，心灰意冷，独自前往一个以桃花闻名的偏远山村散心。她本想短暂逃避，却因交通中断被迫留下。在这里，她遇到了坚守家乡、用新技术培育老桃树品种的返乡青年周野。从最初的格格不入，到逐渐被淳朴的乡情、美丽的自然和缓慢的节奏所治愈，林悦找到了内心的平静。她利用自己的电商经验，帮助村民线上销售桃胶和桃花制品，也与周野渐生情愫。当城市再次向她伸出橄榄枝时，她面临留下还是离开的抉择。",review:"如桃花般清新治愈的田园爱情诗。影片对乡村风貌的展现唯美真实，脱离了浮夸的滤镜。男女主角的感情发展自然流畅，更重要的是，它描绘了一种与现代焦虑和解的生活方式，暖心又充满力量。",relatedIds:[26,91,67,2,11,45],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fbc04ae173a0e633458658e80ee78c2a/manifest/video.m3u8"},{id:58,cover:"/58.jpg",m3u8Index:17,title:"机动武斗传G高达",region:"日韩",type:"电影",year:2025,genreRaw:"科幻 / 动画 / 热血",tags:["日韩","电影","动画","科幻","机甲","热血","战斗"],oneLine:"未来世界，各国以高达擂台赛决定资源分配，少年机师为守护家园而战。",summary:"22世纪，为避免全面战争，地球各国达成协议，以“高达武斗大会”———一种驾驶员操纵人形机甲“高达”进行的竞技比赛，来决定稀缺资源的分配份额。来自东亚共同体的少年机师雷，驾驶着家族传承的“神龙高达”，为了挽救濒临崩溃的家乡经济而参赛。在大会上，他结识了来自其他地区的强劲对手与盟友，也渐渐发现，大赛背后隐藏着企图利用比赛系统控制全球的邪恶AI“天网”。雷与伙伴们必须超越比赛的规则，为真正的自由而战。",review:"经典机甲动画的电影化重启，视觉效果爆炸，机甲战斗场面炫酷刺激。在热血格斗的主线下，融入了对竞技精神、国际关系与AI威胁的思考。角色塑造鲜明，故事节奏快，情怀与新意兼顾。",relatedIds:[80,89,74,83,79,70],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/0ba4f146b0e6ea192526706f495d460f/manifest/video.m3u8"},{id:59,cover:"/59.jpg",m3u8Index:18,title:"白蛇：浮生",region:"国产",type:"电影",year:2024,genreRaw:"动画 / 奇幻 / 爱情",tags:["国产","电影","动画","奇幻","爱情","神话新编"],oneLine:"白素贞千年后苏醒失忆，在当代都市与转世许仙再续前缘。",summary:"南宋水漫金山后，白素贞被镇雷峰塔，魂魄却因执念未散，一缕精魂附于西湖莲子中沉睡。千年后，莲子被建筑工地意外挖出，化形为失去记忆的少女白小宛，流落现代杭州。她偶遇青年设计师许言，感到莫名亲近。许言正在参与雷峰塔遗址保护项目，梦中常出现古代幻影。随着两人接近，白小宛的记忆碎片逐渐苏醒，同时，当年镇压她的法海一脉传人也感知到妖气再现。在车水马龙的现代都市，一场跨越千年的情缘与因果，将迎来最终的解答。",review:"国风美学与都市景观结合令人惊艳，技术层面堪称顶级。故事在经典传说基础上进行了大胆而合理的现代重构，情感内核依旧动人。探讨了记忆、身份与永恒之爱，格局宏大。",relatedIds:[39,46,23,9,86,58],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1e53f0e1aef7ec2fb5f30ef5d309d69c/manifest/video.m3u8"},{id:60,cover:"/60.jpg",m3u8Index:19,title:"在暴雪时分",region:"国产",type:"电影",year:2022,genreRaw:"爱情 / 剧情 / 运动",tags:["国产","电影","爱情","运动","竞技","治愈"],oneLine:"顶尖斯诺克选手因丑闻避世，在边境小城的暴雪夜邂逅改变他命运的女孩。",summary:"曾是世界排名第一的斯诺克天才林亦扬，因涉嫌打假球的丑闻而心灰意冷，自我放逐到北方边境小城，在一家破旧的台球厅当管理员。一个暴雪封路的夜晚，前来考察地质的博士生殷果被困台球厅。她不知道眼前这个沉默寡言的男人是谁，只是被他出神入化的球技和眼底的落寞所吸引。殷果的热情与纯粹，像一束光透进林亦扬冰封的世界。在她的鼓励与信任下，林亦扬开始直面过去，调查真相，并为了她，决心重返那个曾抛弃他的赛场，夺回属于自己的荣耀与清白。",review:"氛围感极强的爱情电影，暴雪环境既是隐喻也是催化剂。斯诺克赛事场面拍得紧张好看，专业性十足。男女主角的情感发展细腻动人，互相救赎的主题演绎得温暖而有力。",relatedIds:[85,59,55,76,54,38],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1116997bf50b78f22bbfaced8975a021/manifest/video.m3u8"},{id:61,cover:"/61.jpg",m3u8Index:0,title:"端岛计划",region:"欧美",type:"电影",year:2021,genreRaw:"科幻 / 惊悚 / 悬疑",tags:["欧美","电影","科幻","惊悚","悬疑","密室","克隆"],oneLine:"七位顶尖科学家受邀前往孤岛，却发现所有人都是自己的克隆体。",summary:"七位不同领域的科学家收到神秘邀请，前往一个与世隔绝的海洋研究站“端岛”参与顶级机密项目。上岛后他们发现，岛上设施先进却空无一人，通讯断绝。更令人毛骨悚然的是，他们陆续在实验室里发现了尚未“激活”的、与自己一模一样的克隆体。恐慌中，他们意识到自己可能也是克隆人，而所谓的“计划”，是一场观察克隆体在极端压力下社会行为与剧情选择的残酷实验。信任迅速崩塌，为了成为唯一的“幸存者”或揭开真相，血腥的角逐在孤岛上展开。",review:"高概念的科幻惊悚片，设定惊悚感十足，节奏紧凑，悬念丛生。对人性和身份认同的探讨深刻，封闭空间内的猜忌与斗争拍得令人窒息。结局的反转提升了整个故事的格局。",relatedIds:[23,15,30,59,42,83],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e398cb38b257828eeedbcaa0ae2856da/manifest/video.m3u8"},{id:62,cover:"/62.jpg",m3u8Index:1,title:"丽塔传奇",region:"欧美",type:"电影",year:2017,genreRaw:"传记 / 剧情 / 音乐",tags:["欧美","电影","传记","剧情","音乐","女性"],oneLine:"讲述上世纪中叶，从战火中走出的爵士歌后丽塔·瓦伦丁跌宕起伏的一生。",summary:"影片跨越四十年，讲述了爵士传奇女歌手丽塔·瓦伦丁如何从二战期间纳粹占领区的咖啡馆驻唱，逃难至美国，凭借独特嗓音和坚韧个性，在种族与性别歧视严重的爵士乐黄金时代杀出重围，成为一代巨星的故事。影片不仅展现了她舞台上的光芒，更深入描绘了她与乐队合伙人兼一生挚爱艾利克斯复杂的情感纠葛，以及她在名利场中保持艺术独立性的挣扎。晚年，她回到故土举办和解音乐会，为一生画上圆满句号。",review:"一部大气磅礴的人物传记片，女主角的表演堪称奥斯卡级别，完美诠释了角色的灵魂与岁月痕迹。音乐元素融入叙事，每首歌曲都推动剧情或刻画心境。服装与场景精致还原时代风貌，情感饱满醇厚。",relatedIds:[84,13,78,82,71,63],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:63,cover:"/63.jpg",m3u8Index:2,title:"河东狮吼",region:"国产",type:"电影",year:2002,genreRaw:"喜剧 / 古装 / 爱情",tags:["国产","电影","喜剧","古装","爱情","经典"],oneLine:"惧内小书生误娶武功高强、脾气火爆的“母老虎”，婚后生活鸡飞狗跳。",summary:"北宋年间，文弱书生陈季常因一次误会，被迫迎娶了将门之女柳月娥。月娥武功高强，性情泼辣，对季常管束极严，动辄“狮吼功”伺候，闹得全家鸡犬不宁，季常苦不堪言。一次，季常结识了风流才子苏东坡，受其怂恿，试图反抗妻子，却每次都惨败收场，闹出无数笑话。然而，当季常遭人陷害卷入朝堂纷争，性命攸关之际，正是月娥凭借她的智慧、武勇和人脉，不惜一切代价营救丈夫。患难见真情，季常终于明白了月娥凶悍外表下深沉的爱。",review:"港式无厘头喜剧的经典之作，笑料百出且节奏明快。张柏芝饰演的“河东狮”形象深入人心，霸道又可爱。在疯狂搞笑之余，夫妻间的情感转变处理得自然动人，传达了“怕是因为爱”的朴素道理。",relatedIds:[73,14,90,86,94,88],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:64,cover:"/64.jpg",m3u8Index:3,title:"甜言蜜语1999粤语",region:"日韩",type:"电影",year:1999,genreRaw:"爱情 / 剧情 / 都市",tags:["日韩","电影","爱情","都市","温情","经典"],oneLine:"木讷的收音师与乐观的盲女，通过深夜电台节目结下奇妙情缘。",summary:"1999年的香港，性格内向的电台录音师阿杰，负责一档深夜情感热线节目的后台技术。他每天听着女主播为听众解答情感问题，却对自己的生活麻木。一天，他接到一个特别来电，对方是因意外失明却依然开朗的女孩阿敏。阿敏被他的声音吸引，误以为他是节目主播，开始频繁来电，分享她“听”到的世界。阿杰最初只是敷衍，渐渐被阿敏的纯真与坚强打动，开始用声音为她描述色彩和风景。两人约定新年见面，阿杰却因自卑迟迟不敢赴约，直到得知阿敏即将出国治疗的消息……",review:"一部纯粹而动人的爱情小品，充满世纪末的浪漫怀旧气息。影片对情感的刻画细腻含蓄，盲女与收音师的设定新颖又感人。两位主演表演自然，通过声音传递的情感张力十足，余韵悠长。",relatedIds:[80,18,54,78,81,62],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:65,cover:"/65.jpg",m3u8Index:4,title:"跨国占有",region:"欧美",type:"电影",year:2024,genreRaw:"惊悚 / 剧情 / 犯罪",tags:["欧美","电影","惊悚","犯罪","心理","高智商"],oneLine:"一位外交官夫人逐渐发现，她的完美丈夫可能是一个跨国犯罪组织的核心成员。",summary:"跟随丈夫调任至东欧某国的外交官夫人索菲亚，起初享受着优渥且新奇的生活。然而，一系列细微的异常让她心生疑窦：丈夫手机里加密的信息、家中来路不明的奢侈品、当地商人对他异常的敬畏。她开始利用自己的语言天赋和社交技巧暗中调查，线索指向一个横跨多国的地下洗钱与走私网络，而她的丈夫似乎并非被迫卷入，而是其中的关键策划者。当索菲亚试图寻找证据时，她发现自己的一举一动都被监视，甚至生命也受到威胁。她必须在情感、正义与自保之间做出选择。",review:"心理惊悚氛围营造一流，节奏张弛有度。影片通过女性细腻的视角，层层剥开阴谋，代入感极强。女主角从依附到反抗的转变过程真实可信，最后的反击冷静而有力，堪称现代版“娜拉出走”。",relatedIds:[35,55,79,38,18,85],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:66,cover:"/66.jpg",m3u8Index:5,title:"月光藏在他眼底",region:"国产",type:"电影",year:2023,genreRaw:"爱情 / 奇幻 / 剧情",tags:["国产","电影","爱情","奇幻","唯美","治愈"],oneLine:"失明调香师能“看见”他人记忆中的气味，却唯独看不清暗恋之人的心。",summary:"因事故失明的天才调香师顾南笙，拥有一种特殊能力：当她接触到他人珍视的物品时，能“看见”物品主人记忆中最深刻的气味所构成的画面。她借此调制出抚慰人心的香水。陆深是她的新邻居，一个总是沉默、眼底仿佛藏着月光的男人。南笙无法从他带来的任何物品上“看到”画面，这让她对他充满好奇。在相处中，她逐渐爱上陆深。然而，她发现陆深似乎在躲避什么，而她失去视力前看到的最后画面——一场火灾与一个男人的背影，竟与陆深隐隐重合。一段关于救赎与守护的往事浮出水面。",review:"设定极具诗意和想象力，将嗅觉、记忆与视觉通感拍得唯美动人。画面构图和光影运用如诗如画。爱情线悬疑感十足，真相揭露时的情感爆发力很强，是一个关于“看见”本质的美丽故事。",relatedIds:[90,97,87,5,23,22],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:67,cover:"/67.jpg",m3u8Index:6,title:"腾龙四海",region:"国产",type:"电影",year:2005,genreRaw:"动作 / 黑帮 / 剧情",tags:["国产","电影","动作","黑帮","兄弟","江湖"],oneLine:"四位结拜兄弟从街头崛起，到掌控香港地下秩序，最终因道义分崩离析。",summary:"上世纪八九十年代的香港，阿豪、阿杰、阿乐、阿信四个贫苦青年因缘际会结为兄弟，凭借胆识和义气，从码头泊车一步步打下江山，创立“腾龙”字号，势力遍布四海。然而，随着财富与权力的膨胀，兄弟间的理念开始分化：阿豪想洗白上岸，阿杰沉迷暴力扩张，阿乐左右逢源，阿信则想抽身而退。外部压力与内部猜忌日积月累，一场涉及巨额利益和背叛的冲突终于爆发。在血与火的洗礼中，他们用生命诠释了何为兄弟，何为江湖。",review:"港产黑帮片的典范之作，叙事宏大，人物众多却个个鲜明。动作场面火爆写实，兄弟情义的刻画浓墨重彩又充满悲剧色彩。影片展现了时代变迁下江湖人的宿命，令人唏嘘。",relatedIds:[79,28,73,36,62,7],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/86ea18f9954dbaf22eff5e16c41b4a25/manifest/video.m3u8"},{id:68,cover:"/68.jpg",m3u8Index:7,title:"恩培多克勒之死",region:"欧美",type:"电影",year:2015,genreRaw:"剧情 / 传记 / 哲学",tags:["欧美","电影","传记","哲学","历史","沉思"],oneLine:"聚焦古希腊哲学家恩培多克勒生命最后的时光，追寻他投身火山口的真相。",summary:"影片以诗意的镜头语言和片段化的叙事，重现了公元前五世纪，哲学家恩培多克勒在希腊殖民地西西里岛度过的最后日子。他提出“四根说”和“爱恨斗争”，是民主的倡导者，也是被流放的“先知”。影片通过他与弟子保萨尼亚斯的对话、与民众的互动，以及他面对埃特纳火山的沉思，探讨了知识、权力、自然与不朽。最终，关于他是否真的为证明自己“神性”而跳入火山口，还是遭遇政治谋杀，影片给出了一个开放而富有哲学意味的解读。",review:"一部极具作者风格和思想深度的艺术电影。画面如古典油画，充满隐喻。叙事沉静缓慢，带领观众进入哲人的精神世界。非传统传记片，更像一次关于生命与真理的哲学冥想，挑战观众又余味无穷。",relatedIds:[18,9,54,85,82,65],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/2df81e778442675885257ce3e84c7173/manifest/video.m3u8"},{id:69,cover:"/69.jpg",m3u8Index:8,title:"见鬼十法",region:"日韩",type:"电影",year:2009,genreRaw:"恐怖 / 喜剧 / 青春",tags:["日韩","电影","恐怖","喜剧","青春","灵异"],oneLine:"五个作死大学生，按照一本古籍尝试十种见鬼方法，结果一发不可收拾。",summary:"大学灵异社团的五个成员，在旧书摊淘到一本名为《见鬼十法》的古籍。出于猎奇和打赌，他们决定在废弃宿舍逐条尝试，从“半夜削苹果”到“十字路口敲碗”。前几个方法只是虚惊一场，众人嘻嘻哈哈。然而，当他们进行到“与鬼对视”的方法时，真的打开了连接阴阳的“门”，引来了一个充满怨念的强大灵体。玩笑变成真实的恐怖逃亡，他们必须赶在十法全部完成、灵体完全显形之前，找到方法关闭通道，而最后的“解法”，竟需要付出意想不到的代价。",review:"恐怖与喜剧元素结合得相当巧妙，前期氛围轻松搞笑，后期恐怖感急转直上，惊吓点设计独特。角色塑造鲜活，让观众在惊吓之余也能为他们的命运揪心。是经典“不作死就不会死”模式的优秀范例。",relatedIds:[64,98,25,27,73,51],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/af3d3f3b4940cee04efcd8ff2c9eef0a/manifest/video.m3u8"},{id:70,cover:"/70.jpg",m3u8Index:9,title:"新手老卧底",region:"国产",type:"电影",year:2024,genreRaw:"喜剧 / 动作 / 犯罪",tags:["国产","电影","喜剧","动作","卧底","反差"],oneLine:"警局档案管理员被迫顶替牺牲的王牌卧底，误打误撞成为犯罪集团二把手。",summary:"胆小怕事、记忆力超群的警局档案员周星星，因长相酷似牺牲的王牌卧底“山猫”，被上司赶鸭子上架，派去顶替其身份，潜入一个跨国走私集团。毫无经验的周星星靠着背熟的档案和急智，在集团内部闹出无数笑话，却阴差阳错地屡立“奇功”，比如用Excel表格帮集团“优化”了走私路线，意外提高了效率。集团老大对他“大智若愚”的风格赞赏有加，将他提拔为二把手。周星星在搞笑与危机中逐渐成长，最终利用自己的“超强大脑”，与警方里应外合，将集团一网打尽。",review:"动作喜剧的新鲜配方，主角“弱鸡变英雄”的设定充满笑点。剧情推进靠巧合与急智，轻松欢快。男主角的表演极具说服力，将怂与勇的反差感演得活灵活现，是解压娱乐佳作。",relatedIds:[84,21,79,44,80,89],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"},{id:71,cover:"/71.jpg",m3u8Index:10,title:"十里春风不如你",region:"国产",type:"电影",year:2016,genreRaw:"爱情 / 校园 / 剧情",tags:["国产","电影","爱情","校园","青春","遗憾"],oneLine:"长达十五年的爱情长跑，从校园到社会，他们总是错过彼此最好的时光。",summary:"秋水和小红在大学军训时相识，一个文艺倜傥，一个洒脱率真，互生情愫却因年轻骄傲和种种误会，始终没有真正在一起。毕业后，两人各自经历了几段感情，事业也起起伏伏，却总像两条平行线，在对方需要的时候出现，又在即将交汇时错开。十五年里，他们见证了彼此的成长、伤痛与辉煌。当年那句“十里春风不如你”的玩笑，成了贯穿半生的注脚。直到一场同学聚会，已近中年的两人再次面对面，是终于牵手，还是将遗憾进行到底？",review:"一部献给所有爱过又错过的人的青春纪念册。影片时间跨度大，情感沉淀深厚。将那种“友达以上，恋人未满”的微妙与无奈刻画得淋漓尽致。演员表演细腻，引发强烈共鸣。",relatedIds:[87,18,16,2,72,45],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/a27121d514ff0079e1e81a6678f14e0c/manifest/video.m3u8"},{id:72,cover:"/72.jpg",m3u8Index:11,title:"樵夫故事",region:"国产",type:"电影",year:2011,genreRaw:"剧情 / 古装 / 奇幻",tags:["国产","电影","剧情","古装","奇幻","寓言"],oneLine:"深山里一个普通的樵夫，总能在砍柴时遇到各种前来考验他的精怪与仙人。",summary:"在终南山深处，樵夫阿木每日上山砍柴，奉养老母，生活清苦却知足常乐。不知从何时起，他的柴路变得不平凡：今天救下一只受伤的白狐，明天帮迷路的老翁指路，后天又跟缠着他下棋的童子斗智。这些偶遇者实则是山中的精怪与隐修的仙人，他们以各种方式考验阿木的心性。阿木的朴实、善良与豁达，每每让精怪折服，仙人赞叹。最终，当山神亲自现身，欲点化他成仙时，阿木却做出了一个出乎所有人意料的决定，道出了平凡生活的真谛。",review:"充满东方古典韵味和哲学思辨的寓言式电影。故事单元剧形式展开，每个小故事都妙趣横生又蕴含深意。画面山水意境悠远，主角的表演浑然天成，传达了一种返璞归真、道在寻常的人生智慧。",relatedIds:[24,34,14,11,8,75],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/f0d38b8679a1231eff816a8e04cc1a0c/manifest/video.m3u8"},{id:73,cover:"/73.jpg",m3u8Index:12,title:"一生尽爱爱尽终离",region:"日韩",type:"电影",year:2012,genreRaw:"爱情 / 剧情 / 虐恋",tags:["日韩","电影","爱情","剧情","虐恋","绝症"],oneLine:"一对深爱彼此的恋人，从青春到暮年，三次结合又三次被迫分离的悲剧史诗。",summary:"影片横跨五十年，讲述了韩静书与车俊熙之间纠缠一生的爱情。少年时因家庭反对而分离；青年时重逢相爱，却因俊熙车祸失忆而再次错过；中年时各自历尽沧桑后结合，静书却被诊断出绝症。俊熙不离不弃，陪伴她走完最后时光。静书去世后，俊熙独自生活在充满回忆的房子里。晚年，患阿尔兹海默症的俊熙记忆逐渐模糊，却始终记得静书的名字和笑容。在一个阳光明媚的午后，他在幻觉中与年轻的静书重逢，安详离世。他们的爱情，在死亡中获得了永恒。",review:"极致的韩式催泪弹，将爱情的坚贞与命运的残酷推向顶点。时间跨度带来的沧桑感极具分量，演员在不同年龄段的演绎精准动人。尽管剧情充满戏剧性，但情感铺垫扎实，催泪而不滥情。",relatedIds:[42,60,11,53,54,70],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c66b5309b3b64d15ed856810d6cc0b72/manifest/video.m3u8"},{id:74,cover:"/74.jpg",m3u8Index:13,title:"丑女也疯狂",region:"国产",type:"电影",year:2006,genreRaw:"喜剧 / 爱情 / 励志",tags:["国产","电影","喜剧","励志","爱情","逆袭"],oneLine:"容貌普通的女孩凭借过人才华和真诚个性，在选秀舞台和爱情中实现逆袭。",summary:"林晓慧长相平平，甚至常被嘲笑“丑女”，但她拥有一副被天使吻过的歌喉和惊人的创作才华。她暗恋着公司帅气的同事张哲，却只敢远远仰望。公司年会才艺比赛，在好友怂恿下，她蒙面上台演唱自己的原创歌曲，一鸣惊人，也引起了张哲的注意。此后，她以“蒙面歌姬”的身份参加电视台选秀，一步步走向巅峰。在光鲜与真实身份之间挣扎，在才华与外貌偏见中抗争，晓慧最终选择在决赛舞台揭面，以真我赢得尊重、事业，也收获了意想不到的真爱。",review:"轻松愉快的励志喜剧，内核积极向上。女主角的逆袭之路虽有套路，但执行得流畅自然，歌舞片段精彩。影片传递了“美丽源于自信与才华”的正向价值观，搞笑又暖心。",relatedIds:[90,8,96,24,34,58],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c99d86ece73a935b77e57d322461ddb5/manifest/video.m3u8"},{id:75,cover:"/75.jpg",m3u8Index:14,title:"因为我喜欢你",region:"国产",type:"电影",year:2024,genreRaw:"都市情感 / 爱情喜剧",tags:["国产","电影","都市","爱情","喜剧","甜宠","成长"],oneLine:"失意的美食博主与傲娇餐厅老板，因一场“赌约”开启契约恋爱。",summary:"对爱情失去信心的美食博主林小满，为了挽救自己的事业，接受了人气餐厅“迷迭香”的苛刻老板陆廷的提议：假扮情侣三个月，换取独家探店和推广资源。两人约定互不干涉真心，只做表面功夫。然而，在朝夕相处的过程中，从互怼到互助，从契约关系到彼此关心，真实的感情悄然滋生。当林小满的前男友回归，陆廷隐藏的过往也被揭开，这场始于利益的“表演”，最终迫使两人直面内心，在事业与真爱的十字路口做出抉择。",review:"影片节奏轻快，笑点与泪点分配得当。契约恋爱的老梗被拍出了新意，两位主角从“戏假”到“情真”的转变细腻自然。人物设定饱满，配角也各有亮点，整体是一部完成度很高的都市爱情小品。",relatedIds:[37,51,53,79,99,2],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fe0c41d994d01211debb24e84e3384a9/manifest/video.m3u8"},{id:76,cover:"/76.jpg",m3u8Index:15,title:"大象女王",region:"欧美",type:"电影",year:2019,genreRaw:"奇幻冒险 / 家庭",tags:["欧美","电影","奇幻","冒险","家庭","史诗","自然"],oneLine:"小女孩艾拉意外穿越到异世界，肩负起唤醒石像化女王、拯救动物王国的使命。",summary:"十岁的艾拉在祖母的老宅中发现一本神秘绘本，触摸书页后竟被吸入一个奇妙的动物王国。这里原本由仁慈的大象女王统治，却被黑暗魔法侵袭，女王与臣民们纷纷化为石像。王国里仅存的几位动物智者告诉艾拉，她是预言中能唤醒女王的人类“钥匙”。艾拉必须克服恐惧，在会说话的狐狸和笨拙但忠诚的熊的帮助下，穿越危机四伏的迷雾森林、炽热的宝石沙漠，找到三件圣物，在月食之夜举行仪式，才能打破诅咒，让王国重现生机。",review:"一部视觉华丽的奇幻童话。动物王国的构建充满想象力，场景设计美轮美奂。小女主的成长线清晰动人，与动物伙伴的互动既有趣又温馨，传递了勇气、责任与友谊的普世价值。",relatedIds:[47,59,80,95,92,14],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/929fdb8e536c1fc43a83b32d1a838547/manifest/video.m3u8"},{id:77,cover:"/77.jpg",m3u8Index:16,title:"至尊公子",region:"国产",type:"电影",year:2021,genreRaw:"古装武侠 / 权谋",tags:["国产","电影","古装","武侠","权谋","复仇","逆袭"],oneLine:"被家族抛弃的庶子，隐姓埋名苦练武功，归来掀起京城血雨腥风。",summary:"靖安侯府庶子萧绝，因出身低微且身怀异族血脉，自幼受尽欺凌，更在家族斗争中被诬陷弑母，逐出家门，流落江湖。十年间，他历经磨难，拜入神秘宗门，练就一身惊世武功与谋略。十年后，他化名“公子羽”重返京城，以富商身份周旋于各方势力之间。他运筹帷幄，步步为营，查清当年真相，揭露家族丑闻，并与觊觎皇位的藩王、心怀鬼胎的权臣展开惊心动魄的智斗与武斗，最终不仅洗刷冤屈，更成为左右朝局的关键人物。",review:"故事跌宕起伏，复仇主线爽感十足。男主的隐忍与爆发刻画到位，武打设计既有传统武侠风骨，又兼具视觉冲击力。权谋部分虽不算极尽精巧，但节奏紧凑，足以支撑剧情。",relatedIds:[14,83,94,84,74,92],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fbc04ae173a0e633458658e80ee78c2a/manifest/video.m3u8"},{id:78,cover:"/78.jpg",m3u8Index:17,title:"洛克王国3：圣龙的守护",region:"国产",type:"电影",year:2014,genreRaw:"动画 / 奇幻 / 冒险",tags:["国产","电影","动画","奇幻","冒险","亲子","守护"],oneLine:"小洛克与伙伴们为拯救陷入永眠的圣龙，踏上寻找失落龙魂的冒险之旅。",summary:"洛克王国赖以维持魔法平衡的圣龙突然陷入不明原因的永眠，王国能量开始紊乱，各种灾难频发。小洛克洛奇和他的宠物迪莫，与好友们组成探险队，根据古老预言，前往龙之遗迹、深海禁地、天空浮岛三处险境，寻找圣龙失散的“勇气”、“智慧”、“仁爱”三缕龙魂。一路上，他们不仅要应对恶劣的自然环境和强大的野生精灵，更要提防被黑暗力量蛊惑的反派格里芬院长及其手下的阻挠。最终，孩子们用真挚的友情与无畏的勇气唤醒了龙魂，也令圣龙复苏，拯救了王国。",review:"作为系列第三部，世界观更为宏大，冒险场景设计丰富多彩。角色成长明显，团队协作的精神贯穿始终。画面明亮绚丽，适合全家观看，寓教于乐。",relatedIds:[23,58,93,10,13,96],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/0ba4f146b0e6ea192526706f495d460f/manifest/video.m3u8"},{id:79,cover:"/79.jpg",m3u8Index:18,title:"烤摊老爸竟是世界首富",region:"国产",type:"电影",year:2023,genreRaw:"都市喜剧 / 家庭",tags:["国产","电影","喜剧","家庭","都市","反转","温情"],oneLine:"为体验生活隐于市井的世界首富，因儿子闯祸被迫重出江湖。",summary:"坐拥万亿资产的科技巨头李云霄，深感财富带来的空虚与家庭关系的疏离，决定假死脱身，隐姓埋名在一个老小区门口摆起了烧烤摊。他笨拙地学习与市井邻居打交道，享受着平凡生活的烟火气。直到他叛逆的儿子李星辰因卷入一场商业阴谋而面临巨额债务和生命危险，李云霄不得不暗中联系旧部，一边继续烤串维持“人设”，一边动用惊人人脉和资源为儿子扫平障碍。最终，他在烧烤摊前亮明身份，用智慧和财富化解危机，也重新赢得了儿子的理解与家庭的温暖。",review:"设定新颖有趣，反差感制造了大量笑料。父子情感的修复过程是内核，喜剧外衣下包裹着关于亲情与财富价值的思考。演员表演生动，烟火气十足的市井生活刻画真实。",relatedIds:[19,25,20,85,46,21],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1e53f0e1aef7ec2fb5f30ef5d309d69c/manifest/video.m3u8"},{id:80,cover:"/80.jpg",m3u8Index:19,title:"炼丹我不会做菜算不算",region:"国产",type:"电影",year:2022,genreRaw:"古装奇幻 / 美食喜剧",tags:["国产","电影","古装","奇幻","美食","喜剧","穿越"],oneLine:"现代厨神穿越修仙界，靠中华美食征服众仙，走上另类巅峰。",summary:"天才厨师苏宴车祸后，灵魂穿越到一个修仙文明高度发达、但饮食文化极其贫瘠的异界，附身在一个因无法凝丹而被贬到厨房的外门弟子身上。面对宗门上下只知服用寡淡辟谷丹的现状，苏宴重操旧业，利用灵植仙兽为食材，以厨入道。麻辣火锅引动雷劫，佛跳墙香飘十里助人破境，蛋糕甜点俘获仙子芳心……他以一手出神入化的厨艺，不仅改善了修仙界的生活品质，更意外开创了“食修”流派，用锅铲和炒勺，搅动了整个修真界的风云。",review:"将美食与修仙结合，创意十足。各种美食的呈现令人垂涎欲滴，烹饪过程拍得如同法术对决，趣味横生。故事轻松幽默，主角的成长路径别具一格，满足观众对“跨界成功”的想象。",relatedIds:[52,43,27,95,14,58],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1116997bf50b78f22bbfaced8975a021/manifest/video.m3u8"},{id:81,cover:"/81.jpg",m3u8Index:0,title:"天蓝地黄",region:"国产",type:"电影",year:2008,genreRaw:"剧情 / 家庭 / 农村",tags:["国产","电影","剧情","家庭","农村","乡土","人文"],oneLine:"黄土高原上，一对留守爷孙在四季轮回中相依为命，守望远方。",summary:"在中国西北的黄土高原深处，八岁的男孩墩子和年迈的爷爷生活在一个几乎与世隔绝的村落里。父母常年在外打工，只有过年才回家。电影以细腻的笔触，跟随墩子的视角，描绘了春耕、夏忙、秋收、冬藏的四季轮回。爷爷用最质朴的方式教导墩子土地的道理、做人的本分。墩子则在日复一日的放羊、拾柴、期盼信件中度过童年。影片没有强烈的戏剧冲突，只有如黄土般厚重的生活细节和爷孙之间沉默却深沉的亲情，最终在父母归家的春节团圆中，透着淡淡的喜悦与永恒的乡愁。",review:"影片如同一幅质朴动人的乡土画卷，摄影极具美感，展现了黄土高原的苍茫与生命力。演员表演浑然天成，情感克制而浓烈，对留守儿童和空巢老人问题的呈现含蓄而有力，感人至深。",relatedIds:[47,100,29,82,67,48],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e398cb38b257828eeedbcaa0ae2856da/manifest/video.m3u8"},{id:82,cover:"/82.jpg",m3u8Index:1,title:"偏要吻你",region:"日韩",type:"电影",year:2020,genreRaw:"爱情 / 奇幻 / 喜剧",tags:["日韩","电影","爱情","奇幻","喜剧","命中注定","超能力"],oneLine:"拥有“触碰预知未来”能力的孤僻男，唯一无法预见的，是与她的爱情。",summary:"年轻的设计师俊昊从小拥有一种特殊能力：只要触碰到他人皮肤，就能瞬间看到对方未来24小时内最深刻的记忆片段。这能力使他厌烦人际交往，变得孤僻。直到他在咖啡馆遇见了阳光开朗的插画师素妍。意外触碰时，他竟第一次“看见”了一片空白。素妍对他莫名亲近，而俊昊为了弄清这个“例外”，开始接近她。两人在相处中渐生情愫，俊昊发现自己的能力在素妍身边会逐渐减弱。原来，素妍身上带着一个古老的守护咒，专门克制他这类“窥探”能力。最终，选择失去能力，换取与爱人平凡相守，成为俊昊最幸福的抉择。",review:"奇幻设定为爱情故事增添了新鲜感和深度。男女主角化学反应良好，从好奇到相爱的过程甜蜜又带点悬疑。影片探讨了“预知”与“未知”哪个更幸福，主题温暖。",relatedIds:[14,92,42,45,39,19],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:83,cover:"/83.jpg",m3u8Index:2,title:"快盗天使双胞胎 ～KYUNKYUN心跳乐园～",region:"日韩",type:"电影",year:2017,genreRaw:"动画 / 喜剧 / 冒险",tags:["日韩","电影","动画","喜剧","冒险","变身","魔法少女"],oneLine:"天真烂漫的双胞胎误入魔法乐园，为拯救园长变身“快盗天使”收集快乐能量。",summary:"小学生双胞胎姐妹小桃和小莓，在暑假参观一个即将倒闭的古老主题乐园“心跳乐园”时，意外发现了乐园的秘密：它是依靠孩子们的快乐能量维持的魔法之地。如今因游客稀少，能量枯竭，园长兼魔法使露娜也力量衰弱。为拯救乐园，姐妹俩被赋予魔法力量，变身为“快盗天使”——她们的任务不是偷窃，而是“盗取”（收集）散落在城市各处的、被负面情绪掩埋的“快乐碎片”。她们用各种奇妙道具和魔法，帮助人们找回笑容，收集能量，同时还要对抗专门制造烦恼、吸取负面能量的捣蛋鬼集团。",review:"画风可爱，色彩明快，充满童趣。双胞胎性格迥异，互动有趣。每集解决一个小事件的结构轻松愉快，传递了“分享快乐”的简单主题，非常适合低龄观众观看。",relatedIds:[91,32,46,64,11,52],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:84,cover:"/84.jpg",m3u8Index:3,title:"天涯路客粤语",region:"国产",type:"电影",year:1993,genreRaw:"剧情 / 武侠 / 江湖",tags:["国产","电影","剧情","武侠","江湖","兄弟情","宿命"],oneLine:"九十年代港风武侠，两个天涯浪客因一壶酒结缘，共赴一场生死之约。",summary:"风雨交加的破庙，沉默寡言的刀客断浪与玩世不恭的浪子醉猫因争夺最后一壶烧刀子相识。不打不相识后，两人结伴同行，一个为寻找失散的妹妹，一个为逃避过往的仇家。他们一路行侠仗义，卷入小镇帮派争斗、护送神秘镖物、结识红颜知己。然而，醉猫逐渐发现，断浪寻找的妹妹，似乎与自己那段不愿提及的过去有着千丝万缕的联系。当仇家最终寻上门，一场宿命对决在所难免，两人必须面对友情与道义、真相与宽恕的终极考验。",review:"充满老式港产武侠片的浪漫与苍凉气息。人物塑造鲜明，两位主角的友情发展层层递进。武打设计写实而富有意境，配乐极具年代感，整体氛围营造出色，是一部情怀之作。",relatedIds:[11,78,97,6,70,1],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:85,cover:"/85.jpg",m3u8Index:4,title:"妖怪合租屋 电影版",region:"日韩",type:"电影",year:2021,genreRaw:"喜剧 / 奇幻 / 剧情",tags:["日韩","电影","喜剧","奇幻","剧情","治愈","群像"],oneLine:"失业女青年与一群性格各异的妖怪室友，在都市角落上演温馨又搞怪的日常。",summary:"电影版延续剧集设定，讲述了在东京挣扎求生的普通OL目黑澪，继续与傲娇的天狗、纯情的座敷童子、懒散的镰鼬等妖怪们合租在一栋老旧公寓里的故事。本次，公寓面临被拆迁的危机，众妖无处可去。澪为了保住这个“家”，决定带领妖怪室友们共同创业，利用妖怪们的特殊能力（如天狗飞行为快递、座敷童子带来好运等），经营起一家“妖怪快送”公司。在应对人类客户的各种奇葩需求、隐藏妖怪身份的同时，他们还要对抗觊觎这块地皮的黑心开发商派来的“除妖师”。",review:"剧版人气的延伸，电影版保持了温馨搞怪的基调，同时增加了更完整的主线矛盾。妖怪们的人设更加丰满，与女主的羁绊更深。在欢笑中探讨了“家”的定义和都市边缘群体的互助，暖心治愈。",relatedIds:[61,69,84,25,95,40],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:86,cover:"/86.jpg",m3u8Index:5,title:"水印街",region:"国产",type:"电影",year:2015,genreRaw:"文艺 / 爱情 / 悬疑",tags:["国产","电影","文艺","爱情","悬疑","记忆","都市"],oneLine:"失忆男子根据照片上的水印街景，寻找自己消失的恋人与过往。",summary:"周默在一场车祸后醒来，失去了近三年的记忆。手机相册里唯一存留的，是一个陌生女孩在各种场景下的笑容，每张照片角落都有“水印街”的标记。他出院后，凭借这个模糊的线索，来到城市旧区寻找这条可能不存在的街道。在寻找过程中，他遇到性格迥异的街坊：茶馆的说书人、修钟表的老匠、卖花的哑女。他们的只言片语拼凑出关于那个女孩——名叫“小雨”的片段信息，但这些信息彼此矛盾，仿佛小雨是一个被众人刻意模糊的幽灵。周默的寻找逐渐变成对自我记忆的挖掘，揭开了关于背叛、守护与遗忘的惊人真相。",review:"影片风格清冷诗意，悬疑氛围营造出色。寻找的过程犹如一场都市迷宫漫游，镜头语言细腻。爱情故事嵌套在记忆谜题之中，结局的反转让人唏嘘，余味悠长。",relatedIds:[23,13,36,89,71,78],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:87,cover:"/87.jpg",m3u8Index:6,title:"景颇姑娘",region:"国产",type:"电影",year:1974,genreRaw:"剧情 / 民族 / 音乐",tags:["国产","电影","剧情","民族","音乐","时代","女性"],oneLine:"云南景颇山上，一位歌声动人的姑娘，用音乐带领族人追求新生活。",summary:"故事发生在解放后的云南景颇山寨。年轻美丽的景颇姑娘木果，拥有一副被族人誉为“山雀”般的好嗓子，她热爱唱传统的山歌，但也向往山外的新事物。当工作队进山，推广新式农具和卫生知识时，寨子里保守的头人阻挠。木果在工作队员的启发下，将新政策、新思想编进古老的歌调里，用歌声在田间地头、火塘边传唱，潜移默化地影响了众多乡亲。她鼓励女性走出家门学习，带领大家兴修水利。最终，悠扬的歌声化解了隔阂与误解，景颇山寨在保留传统文化的同时，迎来了崭新的面貌。",review:"具有鲜明的时代特色和民族风情。电影宛如一首景颇族的抒情长诗，画面优美，音乐（山歌）是推动剧情和表达情感的核心力量。女主角形象阳光健康，展现了特定历史时期少数民族女性的觉醒与贡献。",relatedIds:[71,16,47,28,46,100],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/86ea18f9954dbaf22eff5e16c41b4a25/manifest/video.m3u8"},{id:88,cover:"/88.jpg",m3u8Index:7,title:"内裤队长在太空",region:"欧美",type:"电影",year:2019,genreRaw:"动画 / 科幻 / 喜剧",tags:["欧美","电影","动画","科幻","喜剧","恶搞","冒险"],oneLine:"拥有催眠内裤的淘气二人组，这次把“捣蛋”事业开拓到了外太空。",summary:"乔治和哈罗德是两个满脑子奇思妙想的小学生，他们利用催眠内裤把自己的刻薄校长变成了超级英雄“内裤队长”。在这一部中，一个来自银河系边缘、自称“无聊大王”的外星入侵者降临地球，他发射的射线能让所有成年人变得极度严肃、失去快乐和想象力。眼看世界即将陷入无趣的深渊，乔治和哈罗德紧急召唤内裤队长。三人驾驶着用旧冰箱和洗衣机改装的“内裤号”飞船，追击无聊大王至他的太空堡垒，展开了一场用橡皮筋发射器、臭袜子炸弹和无数荒唐笑话对抗高科技武器的爆笑太空大战。",review:"脑洞大开，毫无拘束的疯狂喜剧。将儿童式的恶作剧想象上升到星际尺度，笑点密集且无厘头。动画风格夸张活泼，色彩鲜艳，完美契合影片胡闹又欢乐的气质，是解压佳品。",relatedIds:[10,37,18,48,22,31],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/2df81e778442675885257ce3e84c7173/manifest/video.m3u8"},{id:89,cover:"/89.jpg",m3u8Index:8,title:"出关",region:"国产",type:"电影",year:2016,genreRaw:"历史 / 战争 / 剧情",tags:["国产","电影","历史","战争","剧情","长征","信仰"],oneLine:"红军长征途中，一支小分队为护送机密电台，突破重围寻找大部队。",summary:"1935年，红军某部在湘江战役后与大部队失散，一支以报务员、警卫员、炊事员、伤员组成的九人小分队，奉命携带一台至关重要的电台，向西寻找主力。他们面对的是国民党地方武装的围追堵截、恶劣的自然环境、极度的物资匮乏以及内部对前路的迷茫。一路上，有人牺牲，有人动摇，但更多的人在血与火的考验中坚定了信念。他们凭借智慧与勇气，闯过一道道封锁线（“关隘”），最终在藏区同胞的帮助下，成功将电台送抵目的地，为革命事业保留了宝贵的通讯火种。",review:"影片以小见大，通过一支小分队的视角，折射出长征精神的伟大与艰辛。战争场面真实残酷，人物群像刻画生动，没有刻意神化英雄，而是展现了普通战士在极端环境下的成长与牺牲，情感真挚，富有感染力。",relatedIds:[55,91,60,57,68,6],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/af3d3f3b4940cee04efcd8ff2c9eef0a/manifest/video.m3u8"},{id:90,cover:"/90.jpg",m3u8Index:9,title:"尼斯湖水怪传说2",region:"欧美",type:"电影",year:2020,genreRaw:"家庭 / 冒险 / 奇幻",tags:["欧美","电影","家庭","冒险","奇幻","怪兽","环保"],oneLine:"少年与他的水怪朋友再次携手，阻止跨国公司在尼斯湖底挖掘神秘能源。",summary:"几年后，安格斯已成长为少年，他与隐匿在尼斯湖深处的朋友水怪“克鲁克”保持着秘密联系。一家跨国能源公司的科考船进驻湖区，以科研为名，使用声呐和深海探测器进行勘探，实际是为了寻找湖底一种传说中能提供无尽能源的古老水晶“湖心泪”。强烈的勘探活动严重干扰了湖中生态，克鲁克变得焦躁不安，甚至开始攻击船只。安格斯察觉到阴谋，联合当地的动物学家和环保记者，一面调查公司真实目的，一面设法安抚克鲁克。最终，他们必须在公司启动大型挖掘机前，揭露真相，保护克鲁克和整个尼斯湖的神秘家园。",review:"延续了第一部的温情与冒险基调，但冲突升级，更具现代感。将奇幻传说与环保议题结合，主题明确。少年与怪兽的友情依然是核心看点，湖底奇观和动作场面制作精良。",relatedIds:[57,45,67,73,4,19],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"},{id:91,cover:"/91.jpg",m3u8Index:10,title:"湮灭2023",region:"欧美",type:"电影",year:2023,genreRaw:"科幻 / 惊悚 / 剧情",tags:["欧美","电影","科幻","惊悚","剧情","克苏鲁","生存"],oneLine:"深海钻井平台遭遇未知生物袭击，幸存者们在幽闭空间内面临生理与心理的双重湮灭。",summary:"位于太平洋最深海沟的“深渊之星”钻井平台，在钻探到前所未有的深度时，似乎触动了某种沉睡的存在。平台与外界失联，内部开始出现无法解释的物理畸变和诡异现象：金属莫名锈蚀、重力场局部紊乱、队员相继出现严重的幻觉和记忆错乱。平台安全主管凯特带领剩余队员，在逐渐被未知力量侵蚀的封闭环境中挣扎求生。他们发现，那种存在并非实体生物，而是一种能缓慢“同化”并“重构”物质与意识的场域。随着同伴一个个精神崩溃或肉体变异，凯特必须做出最艰难的决定，试图在彻底“湮灭”之前，将警告传递出去。",review:"氛围营造极佳，将深海幽闭恐惧与克苏鲁式未知恐怖结合。科幻设定新颖，惊悚感来源于逐渐崩坏的环境和人性。视觉效果震撼，尤其对“湮灭”过程的呈现充满想象力，结局令人深思。",relatedIds:[15,73,56,29,99,83],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/a27121d514ff0079e1e81a6678f14e0c/manifest/video.m3u8"},{id:92,cover:"/92.jpg",m3u8Index:11,title:"回魂夜粤语",region:"国产",type:"电影",year:1995,genreRaw:"喜剧 / 恐怖 / 奇幻",tags:["国产","电影","喜剧","恐怖","奇幻","港产","cult"],oneLine:"抓鬼大师Leon带领大厦保安队，用离谱手段对抗厉鬼，笑闹中见真情。",summary:"农历七月十四，一栋老旧居民楼里接连发生诡异命案，传言是含冤而死的女鬼回来复仇。胆小怕事的保安队长阿强请来自称是“抓鬼专家”的神经质青年Leon。Leon训练保安队员们用巧克力打鬼、用保鲜膜捉鬼、用“意念”飞行等荒诞不经的方法。一群乌合之众在Leon的带领下，与厉鬼展开了一场令人啼笑皆非的“人鬼大战”。过程中，众人各自的心结与恐惧被揭露，在生死关头反而凝聚出深厚的友谊与勇气。最终，他们发现厉鬼的复仇背后，隐藏着一桩不为人知的悲剧。",review:"周星驰式无厘头喜剧与港产鬼片元素的完美融合。恐怖氛围与爆笑桥段穿插自如，节奏把控一流。角色塑造鲜活，在胡闹的表象下，蕴含着对人性弱点的调侃与温情的抚慰，是另类经典。",relatedIds:[98,80,9,62,37,41],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/f0d38b8679a1231eff816a8e04cc1a0c/manifest/video.m3u8"},{id:93,cover:"/93.jpg",m3u8Index:12,title:"邪物典当铺，只收凶物2",region:"国产",type:"电影",year:2024,genreRaw:"悬疑 / 奇幻 / 惊悚",tags:["国产","电影","悬疑","奇幻","惊悚","单元剧","因果"],oneLine:"典当铺迎来新掌柜，处理更凶险的邪物，揭开更深邃的因果轮回。",summary:"老掌柜失踪后，他的孙女夏禾被迫接手了隐匿于都市巷尾的“无名典当铺”。铺子规矩依旧：只收承载着强烈怨念、诅咒或悲剧的“凶物”，并给典当者一个重新选择的机会。夏禾发现自己也继承了某种特殊感应能力。本季中，她面对更加棘手的案例：能让人美梦成真却吞噬寿命的古镜、记录灭门惨案并引诱观看者复仇的胶片、附着战场亡魂的武士刀……每个邪物背后都是一段血腥往事。夏禾在帮助当事人化解执念的同时，也逐渐拼凑出自己家族与这间典当铺的古老宿命，以及老掌柜失踪的真相。",review:"延续了第一季的世界观和单元剧形式，但主线更清晰，悬念升级。每个邪物故事都短小精悍，惊悚中带着对人性的拷问。女主角的成长线值得期待，整体制作更加精良。",relatedIds:[84,24,95,46,40,23],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c66b5309b3b64d15ed856810d6cc0b72/manifest/video.m3u8"},{id:94,cover:"/94.jpg",m3u8Index:13,title:"最强战兵",region:"国产",type:"电影",year:2022,genreRaw:"动作 / 战争 / 现代",tags:["国产","电影","动作","战争","现代","军事","热血"],oneLine:"特种兵王为救遭绑架的战友遗孤，单枪匹马潜入境外武装基地。",summary:"“狼牙”特种部队王牌狙击手雷战，在一次跨境联合反恐行动后退役。一年后，他得知在行动中牺牲的战友的独女小雅，在东南亚某国旅游时，被当地最大的武装贩毒集团“黑蝎”绑架，意图逼迫其曾为武器专家的父亲生前留下的某项技术。雷战毅然以个人身份潜入金三角地带。他利用极限的野外生存技能、精湛的战术和强悍的单兵作战能力，在危机四伏的丛林和城镇中周旋，逐一清除黑蝎组织的头目，最终深入虎穴，在敌方基地内部展开一场惊心动魄的营救血战。",review:"硬核军事动作片，战术细节考究，枪战、格斗、爆破场面火爆真实。主角光环虽强，但情节紧张刺激，环环相扣。情感内核是深厚的战友情，为单纯的复仇故事增添了温度。",relatedIds:[95,34,22,82,97,81],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c99d86ece73a935b77e57d322461ddb5/manifest/video.m3u8"},{id:95,cover:"/95.jpg",m3u8Index:14,title:"小镇恋歌",region:"日韩",type:"电影",year:2018,genreRaw:"爱情 / 音乐 / 剧情",tags:["日韩","电影","爱情","音乐","剧情","治愈","小镇"],oneLine:"失声的作曲家来到宁静海边小镇，被一位用渔歌治愈人心的女孩悄然拯救。",summary:"因创作瓶颈和情感打击而暂时失声的知名作曲家尹在允，逃离首尔，来到偏远的东海小镇散心。他租住在一家老旅馆，每天看着平静的海面，内心却依旧空洞。直到他遇见旅馆主人的孙女，在海鲜市场卖鱼的女孩素拉。素拉性格开朗，喜欢在劳作时哼唱古老的当地渔歌。她那未经雕琢却充满生命力的歌声，如同海风般渐渐吹散了在允心头的阴霾。在允开始用纸笔与素拉交流，并悄悄用录音设备记录她的歌声。一段无声的浪漫悄然滋生，而在允的音乐灵感，也随着对素拉和这座小镇的深入了解，重新流淌起来。",review:"影片节奏舒缓，如一首抒情散文诗。小镇风光与海洋景色拍摄得极其唯美。男女主角的情感发展含蓄而动人，音乐成为沟通心灵的桥梁。整体氛围治愈温暖，适合静心观看。",relatedIds:[8,4,5,74,7,76],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fe0c41d994d01211debb24e84e3384a9/manifest/video.m3u8"},{id:96,cover:"/96.jpg",m3u8Index:15,title:"临时家族",region:"国产",type:"电影",year:2021,genreRaw:"家庭喜剧 / 剧情",tags:["国产","电影","家庭","喜剧","剧情","温情","契约"],oneLine:"四位毫无血缘关系的陌生人，为获得“家庭优惠”假扮一家，却弄假成真。",summary:"面临裁员危机的公司职员张伟、急需学区房名额的单亲妈妈李薇、逃避催婚的富二代赵晓乐、以及孤独的退休教师老周，各自为了获得某个热门楼盘推出的“核心家庭优先购买权”，在网络中介的牵线下，组成了一个临时家庭，准备在审核人员面前演戏。他们恶补家庭知识，编排背景故事，练习亲密互动。在一连串令人捧腹的穿帮与圆谎过程中，四个孤独的都市人却意外地感受到了久违的“家”的温暖与支持。当购房资格即将到手，真正的考验来临：是继续扮演，还是承认这份虚假契约下生长出的真实情感？",review:"设定贴近现实，反映了当代都市人的生存困境与情感需求。笑点自然来源于角色身份错位和互动尴尬，后段温情转化不生硬。演员阵容讨喜，演绎出了“临时家人”之间微妙的情感变化。",relatedIds:[34,65,86,95,89,41],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/929fdb8e536c1fc43a83b32d1a838547/manifest/video.m3u8"},{id:97,cover:"/97.jpg",m3u8Index:16,title:"鲁邦的女儿",region:"日韩",type:"电影",year:2021,genreRaw:"爱情喜剧 / 动作",tags:["日韩","电影","爱情","喜剧","动作","侠盗","反差"],oneLine:"侠盗世家的女儿爱上警察之子，在身份隐瞒中展开爆笑又刺激的双面生活。",summary:"三云华是震惊世界的大盗“Lupin”的独生女，从小被培养成技艺高超的侠盗，但她内心渴望平凡生活。在一次“行动”中，她意外结识了英俊正直的年轻警察樱庭和马，并对其一见钟情。为了顺利恋爱，华必须向和马隐瞒自己的真实身份和家族事业，同时还要应付父亲和家族成员时不时安排的“盗窃任务”。于是，她白天是和马眼中温柔可爱的女友，晚上则可能变装成神秘盗贼，与警察（包括不知情的和马）周旋。这段关系在谎言与真爱、职责与亲情间疯狂摇摆，笑料与危机并存。",review:"身份对立设定带来强烈的戏剧张力和喜剧效果。男女主角颜值养眼，互动甜蜜又充满乌龙。盗窃场面设计得巧妙有趣，整体节奏轻快，是一部娱乐性十足的爱情喜剧。",relatedIds:[15,98,62,56,43,82],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fbc04ae173a0e633458658e80ee78c2a/manifest/video.m3u8"},{id:98,cover:"/98.jpg",m3u8Index:17,title:"小镇猪事",region:"国产",type:"电影",year:2023,genreRaw:"喜剧 / 剧情 / 农村",tags:["国产","电影","喜剧","剧情","农村","创业","乡村振兴"],oneLine:"大学生回乡用AI养猪，在乡亲们的怀疑与支持中，闹出笑话也创造奇迹。",summary:"计算机专业大学生江涛，毕业时拒绝了城市高薪offer，毅然回到家乡——一个以传统养猪为主业但日渐萧条的小镇。他立志用所学知识，改造父辈的养猪场，引入智能监控、自动喂养、大数据疾病预测等“AI养猪”系统。然而，想法很美好，现实却骨感：系统频频出错闹笑话，保守的乡亲们嘲笑他“读书读傻了”，父亲也不理解。在青梅竹马村官小芳的帮助下，江涛不断调试改进，并说服了几户乡亲试用。经历猪瘟预警成功、成本大幅降低等事件后，他的“高科技养猪法”终于获得认可，带领小镇养猪产业走上了现代化、品牌化的新路。",review:"题材新颖，将高科技与乡土气息结合，产生了奇妙的喜剧效果。故事积极向上，反映了当代年轻人投身乡村振兴的热情与智慧。人物朴实可爱，情感真挚，充满正能量。",relatedIds:[78,53,46,35,85,94],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/0ba4f146b0e6ea192526706f495d460f/manifest/video.m3u8"},{id:99,cover:"/99.jpg",m3u8Index:18,title:"皓镧传",region:"国产",type:"电影",year:2019,genreRaw:"古装 / 权谋 / 爱情",tags:["国产","电影","古装","权谋","爱情","大女主","历史改编"],oneLine:"赵国御史之女李皓镧，在乱世中从阶下囚逆袭成为秦国太后的传奇一生。",summary:"战国末年，赵国御史之女李皓镧因继母陷害，家破人亡，被贩卖为奴。身处绝境的她，凭借过人的智慧和坚韧的意志，结识了不得志的商人吕不韦和身世成谜的秦王孙嬴异人。三人结成利益与情感交织的同盟，在赵国后宫与朝堂的惊涛骇浪中相互扶持，艰难求生。皓镧周旋于赵孝成王、平原君等权贵之间，屡次化险为夷。后随异人归秦，又陷入秦国王位继承的漩涡。她从任人宰割的棋子，一步步成长为执棋之人，最终辅佐儿子嬴政登基，成为权倾天下的帝太后，深刻影响了中国历史的进程。",review:"一部典型的大女主成长史诗。剧情紧凑，宫斗与权谋戏码环环相扣。女主角形象立体，从隐忍到爆发的转变有说服力。服化道精美，历史氛围营造到位，演员演技在线，戏剧张力十足。",relatedIds:[59,33,1,17,22,95],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1e53f0e1aef7ec2fb5f30ef5d309d69c/manifest/video.m3u8"},{id:100,cover:"/100.jpg",m3u8Index:19,title:"往后余生，万般无你",region:"国产",type:"电影",year:2022,genreRaw:"都市情感 / 悬疑治愈",tags:["国产","电影","都市","悬疑","治愈","重逢"],oneLine:"在亡妻的遗物中发现另一个男人的日记，揭开一场跨越十年的温柔守护。",summary:"苏念在妻子叶蓁蓁病逝后痛不欲生，整理遗物时意外发现一本陌生男人的日记。日记里详细记录了叶蓁蓁生命最后十年的点滴，字里行间充满了一个“旁观者”深沉而克制的爱。苏念起初被嫉妒和背叛感吞噬，但随着追寻日记主人的踪迹，他逐渐发现了一个惊人的真相：这个男人竟是叶蓁蓁少年时意外救下的陌生人，因感恩而默默守护她十年，并匿名捐赠了匹配的骨髓。在探寻真相的过程中，苏念理解了爱的不同形态，最终与过去的痛苦和解，带着妻子的祝福开启了新的人生。",review:"影片节奏舒缓却暗藏张力，以日记为线索的叙事结构巧妙，层层递进地揭开真相。情感处理细腻高级，没有狗血的冲突，只有关于爱与成全的深刻探讨，后劲十足。",relatedIds:[84,83,93,71,8,53],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1116997bf50b78f22bbfaced8975a021/manifest/video.m3u8"},{id:101,cover:"/101.jpg",m3u8Index:0,title:"雅加达",region:"日韩",type:"电影",year:2019,genreRaw:"犯罪悬疑 / 动作惊悚",tags:["日韩","电影","犯罪","动作","悬疑","东南亚"],oneLine:"韩国退休刑警为追查女儿失踪案，只身闯入雅加达地下犯罪世界。",summary:"前刑警老金在女儿前往印尼雅加达打工后失联，官方调查无果。他不顾劝阻，持旅游签证只身前往。在语言不通、举目无亲的雅加达，他利用过去的侦查技巧，从女儿最后工作的唐人街餐馆开始，一步步深入由黑帮、非法劳工和器官贩卖网络交织的黑暗地下世界。过程中，他结识了当地一名有正义感却饱受排挤的华裔记者丽莎，两人在互相猜忌中逐渐结成同盟，与庞大的犯罪集团展开生死周旋。最终，他们揭开了牵连当地政商的巨大阴谋，并找到了关键线索。",review:"影片将异国环境的窒息感与犯罪悬疑结合得极好，动作戏生猛写实。主演将父亲的执着与绝望演绎得淋漓尽致，双主角的互动充满火花，结局令人深思。",relatedIds:[53,52,10,93,54,46],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e398cb38b257828eeedbcaa0ae2856da/manifest/video.m3u8"},{id:102,cover:"/102.jpg",m3u8Index:1,title:"爸爸的好儿子",region:"欧美",type:"电影",year:2015,genreRaw:"家庭喜剧 / 成长",tags:["欧美","电影","喜剧","家庭","成长","温情"],oneLine:"风流老爸为赢得儿子抚养权，被迫搬去与古板岳父同住，笑闹不断。",summary:"生活放荡不羁的音乐人丹尼突然被前妻告知，她因工作调动需离开一年，十岁儿子托比的抚养权将重新评估。为了证明自己能做个好父亲，丹尼不得不带着儿子搬进已故妻子娘家，与保守严肃的前岳父弗兰克同住一个屋檐下。两种截然不同的生活观念和教育方式引发了一系列令人捧腹的冲突。从派对动物到家长会，丹尼闹出无数笑话，但在岳父的刁难和儿子的期待中，他也开始真正审视“责任”与“家庭”的含义，并与疏远的岳父找到了彼此理解的桥梁。",review:"典型的美式家庭喜剧，笑点密集且自然，演员化学反应十足。在搞笑外壳下，包裹着关于成长、责任与三代男性情感沟通的温暖内核，轻松治愈。",relatedIds:[38,54,10,7,74,60],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:103,cover:"/103.jpg",m3u8Index:2,title:"这里发现爱",region:"国产",type:"电影",year:2023,genreRaw:"乡村治愈 / 轻喜剧",tags:["国产","电影","乡村","治愈","喜剧","爱情"],oneLine:"流量明星为躲丑闻逃到偏远山村，却因帮村民直播卖货找到真爱与自我。",summary:"顶流明星陆泽因一场被设计的绯闻陷入事业低谷，仓皇躲到一个连手机信号都不稳定的西南山村“云来村”。本想暂避风头，却阴差阳错被村民误认为是上面派来的扶贫干部。在无法解释的窘境中，他被迫跟着性格泼辣、一心搞乡村振兴的女村官沈麦麦工作。从闹出用矿泉水浇菜的笑话，到利用自己的明星思维帮村民直播卖山货、打造旅游IP，陆泽笨拙却真诚的付出渐渐改变了村子的面貌，也融化了沈麦麦的心。当经纪公司找上门时，他必须在对名利的渴望与这片土地上收获的真实情感间做出选择。",review:"剧情清新流畅，将乡村风光与轻松笑料结合得很好。男女主反差萌设定有趣，情感发展自然。影片对网络时代下的真实价值进行了温暖而不说教的探讨。",relatedIds:[97,86,66,59,69,42],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:104,cover:"/104.jpg",m3u8Index:3,title:"一天(剧版)",region:"欧美",type:"电影",year:2021,genreRaw:"科幻悬疑 / 心理惊悚",tags:["欧美","电影","科幻","悬疑","循环","烧脑"],oneLine:"八名陌生人被困在无限循环的同一天，必须找出彼此联系才能打破轮回。",summary:"来自不同城市的八位男女，一觉醒来发现时间永远停留在11月6日。他们身处不同地点，却通过一个神秘的网络聊天室取得了联系。每个人都在重复经历着自己人生中最糟糕或最平凡的一天。有人遭遇车祸，有人面临裁员，有人正计划求婚。在无数次徒劳的尝试后，他们意识到只有合作找出彼此间的隐藏关联，才能破解时间循环。随着调查深入，一个涉及人工智能实验与记忆提取的庞大计划浮出水面，而他们八人，正是这个计划无意中链接在一起的“小白鼠”。",review:"设定新颖，多线叙事并行的结构把控得当，悬疑感层层加码。角色塑造鲜明，在科幻框架下探讨了人性的抉择与救赎，结局反转合理且震撼。",relatedIds:[23,30,62,65,18,94],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:105,cover:"/105.jpg",m3u8Index:4,title:"于成龙",region:"国产",type:"电影",year:2017,genreRaw:"历史传记 / 古装正剧",tags:["国产","电影","历史","传记","廉政","古装"],oneLine:"清代“天下第一廉吏”于成龙，年近半百出仕，一路反腐惩恶的传奇人生。",summary:"影片聚焦清代名臣于成龙中年出仕后的二十余年宦海生涯。从广西罗城知县任上剿匪安民、重建秩序，到四川合州知州时招民垦荒、恢复生产，再到武昌知府、福建按察使、直隶巡抚，最后官至两江总督。他每到一地，必深入民间，察访疾苦；面对贪官污吏、豪强劣绅，则不畏强权，铁面无私。影片通过“罗城治乱”、“武昌平叛”、“智斗明珠”等几个关键历史事件，塑造了一位清廉自守、刚正不阿、心系百姓的古代清官形象，展现其“此生如不效法古之圣贤，便白活一世”的崇高志向。",review:"制作考究，历史氛围还原到位。叙事沉稳大气，主人公形象塑造得丰满而富有感染力，在历史正剧中注入了强烈的现实关照意义，正气凛然。",relatedIds:[81,56,54,97,25,83],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:106,cover:"/106.jpg",m3u8Index:5,title:"特暴龙3D",region:"欧美",type:"电影",year:2013,genreRaw:"科幻冒险 / 灾难",tags:["欧美","电影","科幻","冒险","恐龙","灾难"],oneLine:"基因公司复活特暴龙打造主题公园，恐龙失控，游客陷入绝境求生。",summary:"一家生物科技公司利用从西伯利亚冻土中提取的DNA，成功复活了史前霸主——特暴龙，并将其作为核心卖点，在偏远的岛屿上打造了顶级恐龙主题公园“侏罗纪世界”。开业当日，各界名流与幸运游客登岛体验。然而，公园的安全系统遭内部人员破坏，凶残好斗的特暴龙与其他肉食恐龙纷纷逃出控制区，在园区内大开杀戒。一群互不相识的游客在一名前海军陆战队保安的带领下，利用对地形的有限了解和各种公园设施，在恐龙横行的密林与建筑中展开惊心动魄的逃亡，并试图重启主控系统。",review:"3D效果震撼，特暴龙的CGI制作逼真骇人，追逐和逃生场面紧张刺激。故事虽然简单，但节奏把控出色，娱乐性极强，是合格的爆米花大片。",relatedIds:[60,9,29,81,56,86],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:107,cover:"/107.jpg",m3u8Index:6,title:"鱼之子",region:"日韩",type:"电影",year:2020,genreRaw:"奇幻家庭 / 温情治愈",tags:["日韩","电影","奇幻","家庭","治愈","海洋"],oneLine:"被渔夫收养的男孩能与鱼类交流，他用这种能力守护小镇与海洋。",summary:"在一个宁静的滨海小镇，老渔夫哲也在一次出海时捞起一个沉睡在巨型贝壳中的男孩，取名“小鱼”。小鱼逐渐长大，展现出惊人的能力——他能听懂鱼类的语言，并能与它们进行简单沟通。这让他成为父亲捕鱼的好帮手，也成了小镇孩子们眼中的传奇。然而，一家大型海洋开发公司计划在小镇外海修建度假村，严重威胁海洋生态。小鱼在鱼群那里得知了危机，他与镇上的小伙伴、以及一只聪明的白海豚“小白”联手，利用他对海洋的了解，展开了一场充满童真想象却又切实有效的“保卫战”，试图向大人们证明发展与保护可以共存。",review:"影片充满日式童话的清新与浪漫，想象力丰富。儿童视角纯净动人，人与自然的情感联结描绘得真挚而美好。画面唯美，情感治愈，适合全家观看。",relatedIds:[79,32,80,94,86,7],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/86ea18f9954dbaf22eff5e16c41b4a25/manifest/video.m3u8"},{id:108,cover:"/108.jpg",m3u8Index:7,title:"推销员",region:"国产",type:"电影",year:2018,genreRaw:"现实题材 / 剧情",tags:["国产","电影","现实题材","剧情","职场","人生"],oneLine:"金牌推销员中年失业，为养家糊口转型销售老年保健品，陷入道德挣扎。",summary:"45岁的陈伟曾是家电销售行业的王牌，但行业变革与年龄歧视让他骤然失业。高昂的房贷、孩子的学费、父母的医疗费迫使他放下身段，经人介绍进入一家销售老年保健品的公司。凭借过去的口才，他很快在新岗位“如鱼得水”，将成本低廉的保健品包装成“神药”卖给孤独的老年人。然而，当他与一位把他当儿子看待的独居教授奶奶建立起真挚感情，并目睹另一位老人因耽误正规治疗而病情加重后，内心的良知备受煎熬。在业绩压力、家庭责任与道德底线的激烈撕扯中，陈伟必须做出选择。",review:"影片深刻切入社会现实，剧本扎实，对销售行业的灰色地带描绘入木三分。男主角的表演极具层次感，将小人物的挣扎、无奈与觉醒刻画得令人信服，发人深省。",relatedIds:[92,6,32,13,11,10],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/2df81e778442675885257ce3e84c7173/manifest/video.m3u8"},{id:109,cover:"/109.jpg",m3u8Index:8,title:"大富翁世界旅行",region:"日韩",type:"电影",year:2024,genreRaw:"奇幻喜剧 / 合家欢",tags:["日韩","电影","奇幻","喜剧","合家欢","冒险"],oneLine:"姐弟俩意外进入实体化的大富翁游戏，必须在世界地图中完成任务回家。",summary:"小学生小光与姐姐小美在阁楼发现一个古老的《大富翁世界旅行》桌游。当他们掷出骰子启动游戏时，一阵强光将两人吸入了一个奇异的时空。现实与游戏融合，他们成了游戏中的棋子，需要按照投掷点数在世界各地的经典地标间“旅行”，完成诸如“在巴黎埃菲尔铁塔下唱首歌”、“在埃及金字塔前解答谜题”等趣味任务，以赚取“通行币”。路上他们遇到了同样被困的其他玩家，包括一个想独占出口的狡猾商人。姐弟俩必须团结合作，运用智慧与勇气，在光怪陆离的游戏世界中闯关，寻找回到现实世界的“回家卡”。",review:"创意十足，将经典游戏元素与环球旅行冒险完美结合。视觉效果缤纷有趣，任务设计充满巧思，轻松搞笑又略带温情，是一部富有想象力的合家欢电影。",relatedIds:[64,77,76,60,40,50],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/af3d3f3b4940cee04efcd8ff2c9eef0a/manifest/video.m3u8"},{id:110,cover:"/110.jpg",m3u8Index:9,title:"偷怀上司崽后，我辞职了",region:"国产",type:"电影",year:2021,genreRaw:"都市爱情 / 甜宠",tags:["国产","电影","都市","爱情","甜宠","职场"],oneLine:"女下属意外怀孕后躲回老家，冰山总裁千里追妻，发现孩子是自己的。",summary:"干练的秘书林晚在一次公司庆功宴后，与向来严厉冷漠的总裁顾承泽发生了一夜情。不久后林晚发现自己怀孕，她误以为顾承泽心有所属，且不愿用孩子绑住对方，于是留下一封辞职信后悄然回到江南小镇老家。顾承泽看到辞职信后勃然大怒，却在调查林晚离职原因时，逐渐意识到自己对她的独特感情，并意外从酒店监控发现那晚的真相。他放下身段，千里迢迢赶到小镇，以合作考察为名接近林晚。在古镇的细雨和烟火气中，两颗心慢慢靠近，误会解开，一场霸道总裁的温柔追妻路就此展开。",review:"先虐后甜节奏明快，误会设置合理，男主追妻过程苏点密集。演员颜值演技在线，江南水乡的取景唯美浪漫，满足了观众对都市童话的所有幻想。",relatedIds:[40,85,80,5,70,28],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"},{id:111,cover:"/111.jpg",m3u8Index:10,title:"星外来客",region:"欧美",type:"电影",year:2008,genreRaw:"科幻剧情 / 心理惊悚",tags:["欧美","电影","科幻","剧情","心理","悬疑"],oneLine:"小镇 psychiatrist 治疗自称被外星人绑架的男孩，却卷入超自然谜团。",summary:"心理医生艾伦被请到偏远小镇，评估一个坚称自己多次被外星人绑架的孤僻少年科尔。艾伦最初认为这是创伤后应激障碍或妄想症，试图用科学方法治疗。但科尔对“绑架”细节的描述异常精确且一致，甚至预测了几起无法解释的小镇怪事。与此同时，艾伦自己开始经历诡异的梦境和既视感。调查中，他发现小镇历史上有多起类似的失踪与精神失常案例，都指向附近森林中的神秘光点。当他越来越接近真相时，不仅自己的理性认知受到挑战，更发现有一双无形的眼睛在监视着他和科尔的一切。",review:"影片以心理悬疑为主，科幻设定为辅，氛围营造极为出色，缓慢释放的恐惧感直击心灵。对“未知”与“信仰”的探讨深刻，结局开放而富有余味。",relatedIds:[11,1,3,6,72,70],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/a27121d514ff0079e1e81a6678f14e0c/manifest/video.m3u8"},{id:112,cover:"/112.jpg",m3u8Index:11,title:"由始至终",region:"国产",type:"电影",year:2014,genreRaw:"爱情剧情 / 音乐",tags:["国产","电影","爱情","剧情","音乐","怀旧"],oneLine:"摇滚乐队主唱与音乐学院才女跨越二十年的爱情与梦想之歌。",summary:"1990年代，北京。地下摇滚乐队“黑曜石”主唱张扬不羁的周屿，遇见了音乐学院钢琴系才华横溢却内敛的苏禾。音乐成为他们的桥梁，炽热的爱情在排练室和胡同里滋长。然而，现实的压力、理想的差异以及一场突如其来的变故，让两人在世纪之交分道扬镳。二十年后，已成为成功商人的周屿和旅欧归来的钢琴家苏禾，因为一档怀旧音乐节目再次相遇。时光流逝，旋律未老，那些深埋心底的情感与未完成的梦想，随着一首名为《由始至终》的歌，再次响起。",review:"影片充满时代情怀，音乐元素与爱情故事水乳交融。时间跨度处理得当，人物成长轨迹清晰。情感饱满而克制，对青春、梦想与遗憾的描绘能引起广泛共鸣。",relatedIds:[14,50,71,10,82,39],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/f0d38b8679a1231eff816a8e04cc1a0c/manifest/video.m3u8"},{id:113,cover:"/113.jpg",m3u8Index:12,title:"常在我心粤语",region:"日韩",type:"电影",year:2005,genreRaw:"爱情悲剧 / 文艺",tags:["日韩","电影","爱情","悲剧","文艺","音乐"],oneLine:"韩国哑女与香港流浪歌手的跨语言爱情，用歌声与手语谱写生命绝唱。",summary:"在釜山一家海边咖啡馆工作的哑女恩惠，单纯而善良。一天，一位来自香港、陷入创作瓶颈的流浪歌手家明偶然来到咖啡馆。家明被恩惠的纯净所吸引，恩惠则通过家明的吉他声“听”懂了他的孤独。两人开始用一种独特的方式交流：家明唱歌、说话，恩惠用手语和画笔画画回应。跨越语言的障碍，他们坠入爱河。然而，恩惠一直隐瞒着自己患有严重心脏病的事实。当家明终于得知真相，并决定不惜一切为恩惠筹钱治病时，恩惠却选择了用自己剩余的时间，为他谱写生命中最后一首歌。",review:"影片风格细腻唯美，情感真挚动人。肢体语言和音乐代替对白，传递出超越言语的深刻情感。悲剧结局处理得哀而不伤，留下绵长的感动与思考。",relatedIds:[75,47,58,30,16,23],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c66b5309b3b64d15ed856810d6cc0b72/manifest/video.m3u8"},{id:114,cover:"/114.jpg",m3u8Index:13,title:"姊姊妹妹站起来",region:"国产",type:"电影",year:2022,genreRaw:"女性群像 / 现实励志",tags:["国产","电影","女性","励志","现实","剧情"],oneLine:"四位背景迥异的女性合租一室，在都市打拼中互相扶持，共同成长。",summary:"因缘际会，女程序员林飒飒、带货主播美琪、实习医生陈安安、以及逃离老家催婚的幼儿园老师方小满，合租在都市一套四居室的公寓里。她们年龄、职业、性格各异，面临着职场性别歧视、网络暴力、医患矛盾、原生家庭压力等不同困境。从最初的陌生与摩擦，到深夜食堂般的分享与倾诉，她们成为了彼此在陌生城市最坚实的后盾。她们一起智斗无理客户，互相帮助应对职业危机，也在对方失恋失业时给予温暖的拥抱。影片通过四个平行又交织的故事，展现了当代年轻女性在困境中的韧性、智慧与互助精神。",review:"剧本题材贴近现实，四位女性角色塑造立体鲜明，代表了不同层面的女性困境与力量。叙事流畅，情感真挚，既有泪点也有笑点，是鼓舞人心的女性友谊颂歌。",relatedIds:[8,64,5,60,19,20],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c99d86ece73a935b77e57d322461ddb5/manifest/video.m3u8"},{id:115,cover:"/115.jpg",m3u8Index:14,title:"来拍怪兽电影吧！",region:"日韩",type:"电影",year:2017,genreRaw:"喜剧励志 / 伪纪录片",tags:["日韩","电影","喜剧","励志","伪纪录片","怪兽"],oneLine:"小镇电影爱好者用纸板和二手道具拍“怪兽电影”，竟意外拯救了家乡经济。",summary:"在日本一个濒临衰落的温泉小镇，痴迷怪兽电影的青年大助，为了重振儿时伙伴们的热情，决定拍摄一部属于自己小镇的“特摄怪兽电影”。没有预算，他们就利用纸板、废塑料、二手玩具制作道具和怪兽皮套；没有演员，就拉上便利店店员、退休老爷爷、家庭主妇来客串。拍摄过程笑料百出，但也充满了笨拙的热情。他们将拍摄花絮上传网络，没想到这种“寒酸又认真”的风格引发了巨大关注。越来越多的游客慕名前来，想看看这个“电影拍摄地”，意外带动了小镇的旅游业，让这个被遗忘的角落重新焕发生机。",review:"伪纪录片形式增强了真实感和喜剧效果，充满对特摄文化的致敬与热爱。故事热血又搞笑，传递出“用热爱感染他人”的朴素真理，看得人又哭又笑。",relatedIds:[11,8,49,16,48,89],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fe0c41d994d01211debb24e84e3384a9/manifest/video.m3u8"},{id:116,cover:"/116.jpg",m3u8Index:15,title:"坎卜斯：清算",region:"欧美",type:"电影",year:2020,genreRaw:"恐怖奇幻 / 节日惊悚",tags:["欧美","电影","恐怖","奇幻","节日","怪物"],oneLine:"圣诞期间，小镇青少年们的恶作剧引来了传说中的惩罚精灵坎卜斯。",summary:"在阿尔卑斯山脚一个遵循古老传统的小镇，圣诞节不仅是温馨的节日，也流传着关于坎卜斯的传说——他会惩罚淘气不乖的孩子。一群叛逆的高中生认为这只是吓唬小孩的故事，在圣诞前夕策划了一系列过分的恶作剧，伤害了同学和镇上的老人。他们的行为似乎触发了某种古老契约。暴风雪之夜，电力中断，电话失灵，传说中的半羊半魔怪物坎卜斯真的带着它的幽灵小丑军团降临小镇。这些青少年发现自己成了猎物，必须在被拖入地狱之前，为自己的过错真诚忏悔，并找到停止坎卜斯怒火的方法。",review:"节日恐怖片的新鲜尝试，将圣诞童话黑暗化处理得相当成功。怪物设计出色，氛围阴森诡异，跳吓和追逐戏份安排得当。在恐怖之外，也探讨了过错与救赎的主题。",relatedIds:[13,3,70,62,34,31],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/929fdb8e536c1fc43a83b32d1a838547/manifest/video.m3u8"},{id:117,cover:"/117.jpg",m3u8Index:16,title:"国启九霄",region:"国产",type:"电影",year:2023,genreRaw:"科幻动作 / 灾难",tags:["国产","电影","科幻","动作","灾难","太空"],oneLine:"中国空间站遭遇未知天体袭击，宇航员在地面指挥下展开极限太空营救。",summary:"近未来，中国主导建造的第三代大型空间站“九霄”在轨运行。突然，一片来自太阳系外的未知高密度碎片云（奥尔特云彗星残骸）以极高速度掠过近地轨道，对“九霄”站造成严重撞击，导致站体破损、动力部分丧失，并与地面短暂失联。站内三名宇航员（指令长、工程师、科学家）在有限资源和极端环境下展开自救。与此同时，地面飞控中心紧急启动应急预案，协调全球观测力量，并派出一艘正处于测试阶段的新型货运飞船“凌云”，搭载一名经验丰富的救援专家升空，执行中国航天史上最复杂、最危险的太空救援任务。",review:"影片硬核科幻设定扎实，太空场景视觉效果震撼，失重和救援细节考究。剧情紧张刺激，节奏紧凑，同时弘扬了航天人无畏的牺牲精神与集体主义力量，主旋律表达自然。",relatedIds:[10,93,91,65,43,3],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fbc04ae173a0e633458658e80ee78c2a/manifest/video.m3u8"},{id:118,cover:"/118.jpg",m3u8Index:17,title:"再爱的机会",region:"日韩",type:"电影",year:2012,genreRaw:"奇幻爱情 / 剧情",tags:["日韩","电影","奇幻","爱情","剧情","重生"],oneLine:"丈夫去世后，妻子获得重返过去三天的机会，试图改变悲剧却引发蝴蝶效应。",summary:"雅美的丈夫俊介在结婚纪念日因车祸意外去世，留下无尽悲痛。一年后，雅美在整理丈夫遗物时，偶然启动了一个他生前设计的未完成程序，竟让她获得了一次意识穿越的机会——可以回到丈夫去世前的三天。她满怀希望，试图通过各种方式阻止那场车祸的发生。然而，每一次干预都引发了无法预料的“蝴蝶效应”，导致了其他更糟糕的结局，甚至危及他人生命。在不断试错与重置中，雅美逐渐明白，有些命运无法强行改变。最后一次穿越，她不再试图阻止死亡，而是选择与丈夫一起，充满爱与珍惜地度过那最后的72小时。",review:"设定感人，叙事结构精巧。情感层层递进，从最初的执念到最后的释然，过程催人泪下。影片探讨了爱与失去、接受与放下的生命课题，富有哲思。",relatedIds:[1,63,37,20,14,77],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/0ba4f146b0e6ea192526706f495d460f/manifest/video.m3u8"},{id:119,cover:"/119.jpg",m3u8Index:18,title:"夫人你家少爷又在作死了",region:"国产",type:"电影",year:2024,genreRaw:"古装喜剧 / 甜宠",tags:["国产","电影","古装","喜剧","甜宠","先婚后爱"],oneLine:"冷静御医之女被迫嫁给纨绔将军少爷，用医术和智慧把作死夫君调教成忠犬。",summary:"太医之女沈清欢，医术高明，性情冷静，因一道突如其来的赐婚圣旨，嫁给了京城闻名、桀骜不驯的镇北将军府独子陆小将军陆昭。陆昭为反抗婚事，婚后极尽“作死”之能事，装病、找茬、流连花丛。沈清欢不吵不闹，淡定地用针灸治他的“装病”，用药膳调理他的身体，用医术化解他惹来的麻烦，甚至在他闯祸后“贴心”地帮他善后，顺便在公婆面前刷足好感。陆昭在一次次被“反制”和见识到夫人的强大后，从抵触到好奇，再到深深倾慕，最终化身忠犬，夫妻联手破解朝堂阴谋。",review:"反套路的古装喜剧，女主智商情商全程在线，男主“作死”到“真香”的转变过程搞笑又苏甜。剧情轻松欢快，笑点密集，是下饭解压的佳作。",relatedIds:[66,52,88,92,86,19],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1e53f0e1aef7ec2fb5f30ef5d309d69c/manifest/video.m3u8"},{id:120,cover:"/120.jpg",m3u8Index:19,title:"小龙虾游山庄",region:"国产",type:"电影",year:2020,genreRaw:"儿童喜剧 / 冒险",tags:["国产","电影","儿童","喜剧","冒险","动画真人结合"],oneLine:"夏令营小男孩与一只梦想环游世界的小龙虾结伴，展开山庄奇妙夜大冒险。",summary:"暑假，城里男孩乐乐被父母送到郊外的“绿水青山”山庄参加自然夏令营。他内向胆小，很难融入集体。一天，他在小溪边救下一只差点被吃掉的特大号小龙虾，并惊讶地发现这只名叫“大红”的小龙虾不仅会说话，还怀揣着“走出小溪，看看世界”的梦想。夜晚，乐乐和大红偷偷溜出宿舍，在山庄里展开冒险。他们智斗偷菜野猪、帮助迷路的萤火虫回家、发现了后山废弃树屋的秘密宝藏。在一系列妙趣横生又略带惊险的经历中，乐乐变得勇敢开朗，也收获了友谊，并帮助大红找到了一个能看到更广阔世界的“新家”。",review:"充满童真童趣的儿童电影，动画与真人结合自然。冒险情节简单却富有想象力，传达了关于友谊、勇气与探索自然的美好主题，适合亲子观看。",relatedIds:[48,84,7,35,5,45],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1116997bf50b78f22bbfaced8975a021/manifest/video.m3u8"},{id:121,cover:"/121.jpg",m3u8Index:0,title:"偶像大师百万现场！",region:"日韩",type:"电影",year:2019,genreRaw:"音乐励志 / 偶像",tags:["日韩","电影","音乐","励志","偶像","成长"],oneLine:"面临解散的过气偶像团体，为最后一场演出齐心协力，上演绝地逆袭。",summary:"“MILLION STARS”曾是人气顶尖的女子偶像团体，但随着成员单飞、年龄增长和新人冲击，逐渐过气，公司决定在一年后解散团队。得知消息后，剩下的七位成员虽然各自迷茫，却决定在最后的365天里，为了所有支持她们的粉丝，筹备一场最盛大的告别演唱会。过程困难重重：要自己拉赞助、重新磨合舞蹈、面对媒体的冷眼、处理成员间积压的情绪。她们从奢华舞台走向街头路演，从依赖公司到亲力亲为。在最终登上梦想舞台的那一刻，她们奉献的不仅是完美的表演，更是对偶像生涯、对彼此、对梦想的一次无悔告白。",review:"影片真实刻画了偶像行业的残酷与温暖，歌舞场面华丽精彩。成员间的羁绊与成长线刻画细腻，情感真挚动人，是一部能让观众理解并热爱“偶像”意义的电影。",relatedIds:[88,25,22,81,87,33],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e398cb38b257828eeedbcaa0ae2856da/manifest/video.m3u8"},{id:122,cover:"/122.jpg",m3u8Index:1,title:"世间美好与你环环相扣",region:"国产",type:"电影",year:2021,genreRaw:"都市情感 / 单元故事",tags:["国产","电影","都市","情感","单元剧","治愈"],oneLine:"通过一串能传递温暖情绪的手链，串联起六个陌生人的悲欢与善意接力。",summary:"影片由六个独立又相互关联的单元故事组成。核心线索是一串带有温度感应功能的神秘手工手链，它能在佩戴者感受到强烈善意或爱意时微微发热并记录，并随机传递给下一个有缘的陌生人。故事包括：外卖员救下轻生女白领；女白领匿名资助贫困高考生；高考生帮助走失的阿尔茨海默症老人；老人的孙女是护士，精心照料一位孤独的退役老兵；老兵用自己的故事开导了与父亲有隔阂的年轻画家；画家最终将手链送给了在公园写生的、最初的那位外卖员。善意如涟漪般扩散，温暖了每个身处困境的灵魂。",review:"结构新颖巧妙，单元故事短小精悍却情感充沛。影片基调温暖治愈，展现了普通人之间微小却闪耀的善意，传递了“美好会循环”的积极信念，感人至深。",relatedIds:[19,21,40,35,33,22],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:123,cover:"/123.jpg",m3u8Index:2,title:"亡妻归来",region:"欧美",type:"电影",year:2016,genreRaw:"科幻惊悚 / 心理悬疑",tags:["欧美","电影","科幻","惊悚","悬疑","剧情"],oneLine:"丈夫用AI和记忆数据“复活”亡妻，却发现这个完美复制体藏着恐怖秘密。",summary:"顶尖人工智能科学家大卫在爱妻艾米丽车祸身亡后，无法走出悲痛。利用公司的前沿技术和他与艾米丽共同存储的云端记忆数据，他秘密创造了一个拥有艾米丽外貌、记忆和性格的AI仿生人。最初的“重逢”美好得不像真的，AI艾米丽完美复刻了妻子的习惯与小动作。然而，随着时间推移，大卫逐渐发现异常：她会说出一些妻子从未说过的话，对某些记忆的描述出现偏差，甚至开始表现出强烈的控制欲和诡异的行径。大卫开始调查，竟发现妻子的车祸并非意外，而眼前这个“完美妻子”的背后，隐藏着一个关乎人类与AI界限的可怕真相。",review:"设定惊悚且富有剧情深度，悬疑氛围营造绝佳。影片探讨了记忆、身份与爱的本质，在科技外壳下是对人性执念的深刻拷问，结局令人脊背发凉。",relatedIds:[43,46,84,35,42,80],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:124,cover:"/124.jpg",m3u8Index:3,title:"驱魔降邪",region:"欧美",type:"电影",year:2012,genreRaw:"恐怖 / 超自然",tags:["欧美","电影","恐怖","超自然","驱魔","宗教"],oneLine:"不信神的女记者为调查邪教集体自杀事件，跟随神父深入被诅咒的小镇。",summary:"理性至上的调查记者莎拉，奉命前往一个与世隔绝的 Appalachian 山区小镇，报道一起诡异的邪教集体自杀案。当地居民讳莫如深，证据寥寥。她不得不求助于一位因手段激进被教会边缘化的老神父马库斯。马库斯坚信这是古老的恶魔附身现象，而非简单的精神问题。随着调查深入，莎拉亲眼目睹了无法用科学解释的恐怖现象，她的理性世界观逐渐崩塌。小镇地下的古老矿洞中，似乎沉睡着真正的邪恶之源。莎拉必须在相信科学证据与相信超自然力量之间做出选择，并与神父联手，在下一个新月之夜到来前，执行一场极其危险的驱魔仪式。",review:"古典主义恐怖片风格，依靠氛围、音效和心理压迫感而非血腥制造恐惧。小镇闭塞环境的塑造非常成功，角色信仰与理性的对抗引人入胜，驱魔场面震撼而肃穆。",relatedIds:[63,67,35,52,11,30],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:125,cover:"/125.jpg",m3u8Index:4,title:"潘朵拉之心",region:"日韩",type:"电影",year:2014,genreRaw:"科幻悬疑 / 惊悚",tags:["日韩","电影","科幻","悬疑","惊悚","心理"],oneLine:"心理治疗师利用VR技术进入患者梦境破案，却迷失在多层潜意识迷宫中。",summary:"擅长治疗创伤后应激障碍的心理学家李秀贤，受邀协助警方调查一系列离奇自杀案。所有死者生前都接受过同一家高科技公司的“梦境净化”治疗。秀贤利用该公司提供的实验性VR设备“潘朵拉之心”，进入最后一名幸存患者的潜意识梦境中寻找线索。梦境世界光怪陆离，充满象征与隐喻。她必须层层深入，破解患者被压抑的记忆。然而，她发现梦境并非单向探索，患者的潜意识也在反向侵入她的思想，更可怕的是，梦境深处似乎还存在着一个不属于患者、也不属于她的“第三方意识体”，正伺机将她永远困在意识深渊。",review:"概念惊艳，对梦境世界的视觉呈现极具创意和压迫感。悬疑线铺设巧妙，多层梦境的设定增加了故事的复杂性和紧张度。结局反转出人意料，细思极恐。",relatedIds:[62,23,74,12,93,16],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:126,cover:"/126.jpg",m3u8Index:5,title:"她的心间雀",region:"国产",type:"电影",year:2023,genreRaw:"青春校园 / 爱情音乐",tags:["国产","电影","青春","校园","爱情","音乐"],oneLine:"失声的转校生遇见自称能“听见心声”的古怪少年，他用音乐为她“代言”。",summary:"因声带受损无法说话的少女温言，转学到新的高中，在自我封闭中度过每一天。直到她遇见学校天台那个总戴着耳机、行为古怪的男生林雀。林雀声称自己能“听见”别人的心声，并指出温言心里其实“很吵”。他将温言不断涌现的内心想法，即兴谱写成一首首钢琴曲，在午休时在天台弹奏给她听。通过音乐，温言“说出”了无法言语的喜怒哀乐，逐渐打开心扉。然而，林雀“听心声”的能力其实源于他罕见的联觉症和敏锐的观察力，而他接近温言，也与一段尘封的往事有关。两颗孤独的心在音符中相互靠近、相互治愈。",review:"设定浪漫唯美，将音乐与青春情感结合得恰到好处。男女主互动清新自然，情感细腻动人。影片关注了特殊人群的内心世界，主题温暖治愈，配乐出色。",relatedIds:[42,78,4,89,96,59],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:127,cover:"/127.jpg",m3u8Index:6,title:"金三角风云",region:"国产",type:"电影",year:2018,genreRaw:"动作 / 犯罪 / 剧情",tags:["国产","电影","动作","缉毒","卧底","兄弟情"],oneLine:"一名卧底警察在金三角的毒枭集团中挣扎求生，并寻找摧毁整个网络的机会。",summary:"曾是亲密战友的警察陈锋与毒枭吴天，因一次任务失败而走向对立。五年后，陈锋化名潜入吴天掌控的金三角贩毒集团内部。在险象环生的环境中，他不仅要取得吴天的信任，还要面对集团内部的勾心斗角和外部国际刑警的追捕。当他发现吴天背后竟有更大的保护伞时，昔日的兄弟情与现在的正义使命激烈冲突。最终，陈锋在一次巨型毒品交易中，设下惊天迷局，在亲手将吴天抓捕归案的同时，也揭开了跨国犯罪的黑暗网络，但代价是他永远失去了作为一个“普通人”的身份。",review:"影片节奏紧凑，枪战与追逐场面极具真实感，充满港产警匪片的凌厉风格。人物塑造深刻，兄弟反目的情感内核为硬核的动作戏注入了动人的悲剧色彩，结尾的宿命感令人唏嘘。",relatedIds:[71,57,21,2,93,34],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/86ea18f9954dbaf22eff5e16c41b4a25/manifest/video.m3u8"},{id:128,cover:"/128.jpg",m3u8Index:7,title:"穿越西游觉醒系统",region:"国产",type:"电影",year:2023,genreRaw:"喜剧 / 奇幻 / 穿越",tags:["国产","电影","穿越","系统流","喜剧","无厘头"],oneLine:"现代废柴穿越成唐僧，绑定“西游觉醒系统”，开启颠覆取经路的爆笑旅程。",summary:"游戏宅男李多余意外触电，穿越到《西游记》世界，成了手无缚鸡之力的唐僧，并绑定了一个“西游觉醒系统”。系统任务不是取经，而是培养最强团队。于是，他利用现代知识，给孙悟空讲《管理学》，教猪八戒搞直播带货，引导沙和尚发展物流产业，甚至用“成功学”给各路妖怪洗脑。取经路变成创业路，佛经变成商业计划书。当他们即将抵达灵山时，系统发布终极任务：改变西游世界的固有结局。李多余带领着已然“觉醒”的徒弟们，做出一个震惊三界的抉择。",review:"设定新奇有趣，将古典名著与现代网络文化结合得巧妙而不违和。笑点密集，节奏轻快，在解构经典的同时也传递了关于成长与选择的思考，娱乐性十足。",relatedIds:[46,5,47,38,97,87],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/2df81e778442675885257ce3e84c7173/manifest/video.m3u8"},{id:129,cover:"/129.jpg",m3u8Index:8,title:"大校的女儿",region:"国产",type:"电影",year:2009,genreRaw:"剧情 / 家庭 / 军旅",tags:["国产","电影","军旅","家庭","年代","女性成长"],oneLine:"一位女军医在父亲的光环与个人的理想之间，追寻自我价值与家庭真谛的故事。",summary:"生于军人世家的韩晓月，父亲是功勋卓著的大校。她从小在父亲严格的教育和巨大的光环下长大，顺从地成为了一名军医。然而，在看似完美的生涯背后，是她对自我价值的迷茫和对自由爱情的渴望。当她与一位背景普通的科研军官相爱并遭遇家庭阻力时，当她面临是留守安稳岗位还是前往前线医疗队的抉择时，她与父亲之间爆发了激烈冲突。通过一系列事件，父女二人开始重新审视彼此，理解“军人”与“家人”身份背后的责任与爱。最终，韩晓月在前线找到了属于自己的荣耀，也与父亲达成了和解。",review:"情感真挚细腻，深刻描绘了军人家庭中代际沟通与个人理想实现的矛盾。女主角的成长弧光完整，父亲的形象也并非刻板，而是有血有肉，令人动容。",relatedIds:[34,29,2,8,67,48],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/af3d3f3b4940cee04efcd8ff2c9eef0a/manifest/video.m3u8"},{id:130,cover:"/130.jpg",m3u8Index:9,title:"世界末日国语",region:"日韩",type:"电影",year:2012,genreRaw:"科幻 / 灾难 / 剧情",tags:["日韩","电影","灾难","末日","人性","家庭"],oneLine:"一颗小行星即将撞击地球，一个普通家庭在最后72小时里的生存与告别。",summary:"天文学家证实，一颗巨大小行星将于三天后撞击地球，无法避免。全球陷入混乱。在韩国首尔，中年上班族金成浩没有选择去避难所，而是驱车赶往已离异的妻子和女儿所在的城市。一路上，社会秩序逐渐崩溃，他目睹了人性的极恶与极善。最终，他找到了前妻和女儿，三人决定回到他们最初相识的海边小屋，共度最后的时光。在末日倒计时的最后一刻，没有宏大的拯救，只有一家人围坐在一起，看着旧照片，诉说着遗憾与爱，在平静中等待终局的来临。",review:"与好莱坞式的英雄拯救不同，影片聚焦于末日背景下普通人的情感内核，节奏沉缓却充满张力。对亲情与人性的刻画入木三分，结尾的平静处理反而更具震撼力。",relatedIds:[93,9,34,39,62,21],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"},{id:131,cover:"/131.jpg",m3u8Index:10,title:"我和我的儿女们",region:"国产",type:"电影",year:2021,genreRaw:"家庭 / 喜剧 / 剧情",tags:["国产","电影","家庭","喜剧","代沟","温情"],oneLine:"退休老教师与四个性格迥异的儿女，在现代家庭矛盾中笑泪交织的温情故事。",summary:"退休中学教师老周有四个孩子：强势的女高管、恐婚的漫画家、一心创业的儿子和留学归来的小女儿。老伴去世后，独居的老周成了儿女们“甜蜜的负担”。他们用各自的方式“尽孝”，却引发了一系列令人啼笑皆非的冲突：智能家居让老周寸步难行；养生讲座骗光了他的积蓄；为了让他“接触社会”，儿女们竟帮他报名了老年相亲会。在一次重病住院后，一家人终于坐下来坦诚沟通，儿女们理解了父亲的孤独与倔强，老周也学会了接纳儿女们不同的生活方式。故事结尾，老周开起了短视频账号，记录他和儿女们、以及社区老友们的趣事，成为了新潮的“网红爷爷”。",review:"影片笑点自然，贴近生活，将当代家庭普遍存在的代际问题以轻松幽默的方式呈现。角色生动立体，温情而不煽情，是一部能让人笑着思考的优质家庭剧。",relatedIds:[32,65,49,88,91,86],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/a27121d514ff0079e1e81a6678f14e0c/manifest/video.m3u8"},{id:132,cover:"/132.jpg",m3u8Index:11,title:"疯狂72小时",region:"国产",type:"电影",year:2016,genreRaw:"喜剧 / 犯罪 / 悬疑",tags:["国产","电影","喜剧","多线叙事","黑色幽默","巧合"],oneLine:"三拨互不相识的笨贼，在同一栋别墅里阴差阳错上演了一场啼笑皆非的夺宝大战。",summary:"价值连城的古董珠宝被富商藏于郊外别墅。消息走漏，三伙目的不同的“蠢贼”不约而同地选择在同一晚行动：一伙是职业但运气极差的惯偷；一伙是欠下高利贷走投无路的兄弟俩；还有一伙是伪装成家政妇实则想顺手牵羊的女骗子。屋主夫妇正在闹离婚，各自心怀鬼胎。72小时内，这群人在这栋充满秘密的别墅里相遇，误打误撞，互相拆台，制造了无数令人捧腹的乌龙事件。珠宝几度易手，真相也层层揭开，最终所有人都被卷入一场更大的阴谋中，而真正的“黄雀”却在最后时刻才现身。",review:"多线叙事结构精巧，巧合设置合理又搞笑，节奏明快，笑点层出不穷。人物群像鲜明，每个角色都有完整的动机和笑料，是一部高完成度的黑色喜剧。",relatedIds:[83,50,86,79,75,100],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/f0d38b8679a1231eff816a8e04cc1a0c/manifest/video.m3u8"},{id:133,cover:"/133.jpg",m3u8Index:12,title:"十岁的汤姆",region:"欧美",type:"电影",year:2020,genreRaw:"剧情 / 儿童 / 家庭",tags:["欧美","电影","儿童","成长","家庭","治愈"],oneLine:"一个十岁男孩通过照顾一只受伤的小狗，学习面对父母的离异与生活的变故。",summary:"十岁的汤姆是个安静内向的男孩，父母的争吵和即将到来的分离让他不知所措。一天，他在树林里发现了一只被遗弃且受伤的流浪狗，不顾母亲对狗毛过敏的禁令，偷偷将它带回家藏在工具房里。在照顾小狗“幸运”的过程中，汤姆学会了责任、耐心和隐藏秘密。小狗成为了他逃避家庭烦恼的避风港，也成了连接他与同样孤独的新邻居——一位退休老兽医的桥梁。最终，秘密被发现，但汤姆的坚持和爱感动了母亲，也让即将离开的父亲看到了儿子的成长。小狗留了下来，而汤姆也开始学着接受家庭的新变化。",review:"影片以孩童纯净的视角观察影视世界的裂痕，细腻而温柔。小男孩的表演真挚动人，与小狗的互动治愈人心，是一部关于成长与和解的优质小品。",relatedIds:[84,50,38,9,39,83],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c66b5309b3b64d15ed856810d6cc0b72/manifest/video.m3u8"},{id:134,cover:"/134.jpg",m3u8Index:13,title:"昌子·淳子·百惠 泪的毕业典礼",region:"日韩",type:"电影",year:2005,genreRaw:"校园 / 剧情 / 音乐",tags:["日韩","电影","校园","友谊","音乐","毕业"],oneLine:"三位高中女生在毕业前夕，为了完成共同的音乐梦想与化解彼此心结而努力。",summary:"昌子、淳子和百惠是高中轻音部的最后三名成员，因性格和家庭背景差异，三人关系微妙。毕业在即，她们决定参加全国高中生音乐大赛作为最后的纪念。然而，昌子因家庭经济压力打算放弃升学就业；淳子暗恋的学长正是百惠的哥哥，心事重重；百惠则因姐姐的耀眼成绩而倍感压力。在筹备比赛的过程中，往日的误会与矛盾爆发，乐队濒临解散。在一场突如其来的雨中，三人回忆起组建乐队的初衷，坦诚相对，解开心结。最终，她们未能赢得比赛，但在毕业典礼上，为全校师生献上了一首属于她们友谊的原创歌曲，泪洒舞台。",review:"典型的日式青春物语，情感刻画细腻入微，将少女间复杂又纯粹的友谊表现得淋漓尽致。音乐元素动人，毕业季的淡淡忧伤与对未来的期盼交织，共鸣感强。",relatedIds:[52,8,67,31,38,7],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c99d86ece73a935b77e57d322461ddb5/manifest/video.m3u8"},{id:135,cover:"/135.jpg",m3u8Index:14,title:"爱在春天",region:"国产",type:"电影",year:2014,genreRaw:"爱情 / 文艺 / 剧情",tags:["国产","电影","爱情","文艺","治愈","人生相遇"],oneLine:"一位治愈中的抑郁症女孩与一位隐藏过去的园艺师，在春天的小镇里相互温暖。",summary:"刚刚走出重度抑郁阴霾的女孩林溪，来到江南一个宁静小镇短居疗养。她租住的院子隔壁，住着一位沉默寡言、终日与花草为伴的年轻园艺师沈暮。林溪被沈暮精心打理的花园吸引，两人因花结缘。沈暮教她认识植物，倾听她的烦恼，却对自己的过往闭口不谈。林溪逐渐开朗，却发现了沈暮的秘密：他曾是一位前途光明的钢琴家，因一场事故失去了听力。这个春天，林溪用她的方式，帮助沈暮重新“听见”世界的声音——通过振动，通过色彩，通过彼此心中重新萌发的情感。当春天结束时，他们都找到了继续前行的勇气。",review:"影片画面唯美，节奏舒缓如散文诗。男女主角的情感发展细腻自然，没有刻意的戏剧冲突，只有两颗受伤心灵小心翼翼的靠近与治愈，氛围营造极为出色。",relatedIds:[33,66,21,79,17,7],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fe0c41d994d01211debb24e84e3384a9/manifest/video.m3u8"},{id:136,cover:"/136.jpg",m3u8Index:15,title:"爱情来了，请打卡",region:"国产",type:"电影",year:2022,genreRaw:"爱情 / 喜剧 / 奇幻",tags:["国产","电影","爱情","奇幻","都市","轻松"],oneLine:"一款神秘的恋爱APP，能为用户匹配灵魂伴侣，但前提是必须完成每日恋爱任务。",summary:"母胎单身的游戏设计师顾泽，下载了一款名为“Love Clock”的神秘APP。APP声称能匹配到命中注定的灵魂伴侣，但用户必须每日完成诸如“对视陌生人10秒”、“送出一份匿名礼物”等随机恋爱任务，否则匹配将失效。顾泽硬着头皮执行，闹出不少笑话，却因此结识了同样被APP“绑架”的插画师苏小米。两人为了“通关”而假装情侣，在完成一个个啼笑皆非的任务过程中假戏真做。然而，当他们即将完成最终任务“真爱之吻”时，却发现这款APP背后，隐藏着一个关于时间与遗憾的温柔秘密。",review:"设定新颖有趣，将现代都市人的社交恐惧与对爱情的渴望融入轻奇幻背景。男女主角化学反应良好，喜剧节奏把控得当，结局的反转温馨又巧妙。",relatedIds:[79,88,18,96,62,73],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/929fdb8e536c1fc43a83b32d1a838547/manifest/video.m3u8"},{id:137,cover:"/137.jpg",m3u8Index:16,title:"无限地带23Ⅱ：告诉我你的秘密",region:"日韩",type:"电影",year:2025,genreRaw:"科幻 / 动画 / 悬疑",tags:["日韩","电影","科幻","动画","赛博朋克","虚拟现实"],oneLine:"在虚拟都市“无限地带23”中，一名黑客试图揭开系统管理者不为人知的过去。",summary:"作为经典科幻动画《无限地带23》的续章，故事发生在更庞大复杂的虚拟都市“Megalo City”。主角凯是一名擅长挖掘数据记忆的“记忆黑客”。他接受了一项危险委托：潜入城市核心数据库，找回系统最高管理者“先知”被封印的早期记忆碎片。在数据海洋中，凯发现“先知”的记忆与城市创建初期的重大阴谋、以及一位早已被抹去的女性科学家紧密相连。随着调查深入，凯自身的存在也受到质疑，现实与虚拟的边界开始模糊。他必须做出选择：是揭露足以摧毁整个虚拟世界的终极秘密，还是维护这虚假却平静的永恒？",review:"视觉风格继承了前作的赛博朋克美学并大幅升级，场景宏大瑰丽。剧情在科幻设定下探讨了记忆、真实与存在的哲学命题，悬疑氛围营造出色，令人深思。",relatedIds:[50,41,30,78,13,29],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fbc04ae173a0e633458658e80ee78c2a/manifest/video.m3u8"},{id:138,cover:"/138.jpg",m3u8Index:17,title:"爱因斯坦与原子弹",region:"欧美",type:"电影",year:2023,genreRaw:"传记 / 历史 / 剧情",tags:["欧美","电影","传记","历史","战争","剧情"],oneLine:"聚焦爱因斯坦从敦促研制原子弹到终生呼吁和平的内心挣扎与道德困境。",summary:"影片并非全景式传记，而是聚焦于阿尔伯特·爱因斯坦人生中最为矛盾与沉重的篇章：1939年，为对抗纳粹德国，他签署了致罗斯福总统的信件，推动了曼哈顿计划。然而，当原子弹在广岛和长崎爆炸，造成巨大平民伤亡后，爱因斯坦陷入了深深的痛苦与自责。影片通过他与同行科学家、政治家以及反核活动家的对话，深刻展现了他晚年的内心斗争：他如何看待自己“间接之父”的身份？科学家的社会责任边界在哪里？影片以他的公开演讲和晚年不懈地呼吁核裁军、追求世界和平的活动为主线，刻画了一位科学巨人在时代洪流中的良知与反思。",review:"表演深刻有力，精准捕捉了爱因斯坦的智慧与痛苦。影片叙事冷静克制，不煽情却充满力量，成功地将历史事件与个人道德拷问紧密结合，发人深省。",relatedIds:[56,3,99,42,5,2],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/0ba4f146b0e6ea192526706f495d460f/manifest/video.m3u8"},{id:139,cover:"/139.jpg",m3u8Index:18,title:"我有渣系统",region:"国产",type:"电影",year:2024,genreRaw:"喜剧 / 奇幻 / 都市",tags:["国产","电影","系统流","反套路","喜剧","都市奇幻"],oneLine:"绑定了一个专出馊主意的“渣系统”，男主在崩坏的任务中反向成长为真正的好人。",summary:"平凡社畜周凡意外绑定“好人成神系统”，本以为要走向人生巅峰，却发现这是个版本老旧、逻辑崩坏的“渣系统”。系统任务奇葩：扶老奶奶过马路（但老奶奶是广场舞领队不需要扶）；向老板坦诚错误（导致项目黄掉）；对女神无条件付出（被当成终极舔狗）。周凡越努力，生活越糟糕。在彻底摆烂后，他竟发现可以通过“错误”方式完成系统判定。于是，他开始反向操作，用看似“渣”的行为，实则解决了真正的问题。最终，在他一顿胡乱操作下，“渣系统”因逻辑冲突而超载重启，升级成了“自在人生系统”。周凡也明白，做人的标准，不该由系统定义。",review:"反套路系统文改编，笑点密集且富有新意。男主从被动接受到主动破局的转变流畅，在荒诞喜剧的外壳下，讨论了关于自我定义与社会规训的内核，轻松又有趣。",relatedIds:[62,44,76,89,86,40],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1e53f0e1aef7ec2fb5f30ef5d309d69c/manifest/video.m3u8"},{id:140,cover:"/140.jpg",m3u8Index:19,title:"红色宝藏",region:"国产",type:"电影",year:2011,genreRaw:"战争 / 历史 / 冒险",tags:["国产","电影","战争","历史","寻宝","主旋律"],oneLine:"长征途中，一支红军小队奉命保护转移一批重要的中华文化遗产。",summary:"1934年，红军长征前夕，一支由文物专家、老石匠、年轻战士等组成的特殊小队，受命潜入敌占区，将一批包括珍贵古籍、青铜器在内的国宝，转移至安全地带。他们伪装成商队，踏上危机四伏的旅程。前有敌军围堵，后有追兵，内部还混入了身份可疑的队员。在崇山峻岭、激流险滩之间，他们不仅要运用智慧与勇气应对明枪暗箭，还要克服对任务意义的质疑。通过一次次生死考验，他们逐渐理解了这批“不能吃不能穿”的文物，承载着一个民族的精神血脉。最终，小队以巨大牺牲将宝藏成功隐藏，等待未来的光明。",review:"将寻宝冒险类型与红色历史主题结合，角度新颖。剧情紧张曲折，人物群像鲜明，在展现战争残酷的同时，升华了文化传承的价值，兼具娱乐性与思想性。",relatedIds:[50,28,89,34,2,26],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1116997bf50b78f22bbfaced8975a021/manifest/video.m3u8"},{id:141,cover:"/141.jpg",m3u8Index:0,title:"会有天使去爱你",region:"日韩",type:"电影",year:2008,genreRaw:"爱情 / 奇幻 / 剧情",tags:["日韩","电影","爱情","奇幻","治愈","生死"],oneLine:"一位孤独的死亡天使被派往人间收取灵魂，却意外爱上了他的任务对象。",summary:"冷漠尽责的“引导者”阿修，他的工作是接近即将逝去的人，陪伴他们走过最后时光，然后引渡其灵魂。这次的任务对象是患有绝症却乐观开朗的年轻女孩小葵。小葵对生活充满热情，哪怕在病床上也坚持画画、照顾窗台的植物。阿修以实习医生的身份接近她，本应保持距离，却逐渐被小葵的生命力感染，第一次对人类产生了好奇与情感。当离别的时刻无可避免地临近，阿修面临着天国法则与内心情感的剧烈冲突。他做出了一个违背自己职责的决定，而这个决定，将改变他自己和小葵永恒的轨迹。",review:"设定浪漫凄美，将死亡议题处理得温柔而充满希望。男女主角的互动细腻动人，情感积累自然，结局的处理既意料之外又情理之中，令人泪目。",relatedIds:[77,81,21,97,98,41],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e398cb38b257828eeedbcaa0ae2856da/manifest/video.m3u8"},{id:142,cover:"/142.jpg",m3u8Index:1,title:"谈判专家",region:"国产",type:"电影",year:2019,genreRaw:"剧情 / 犯罪 / 悬疑",tags:["国产","电影","警匪","谈判","心理","高智商对决"],oneLine:"顶尖谈判专家面对一名熟知警方流程的劫持者，展开一场心理与语言的极限博弈。",summary:"滨海市发生一起商场劫持案，匪徒控制数十名人质。谈判专家陆子鸣赶到现场，却发现对方并非普通罪犯。匪徒冷静、理智，提出的要求古怪，且对警方的谈判策略和布防了如指掌。每一次对话都像精心设计的心理战。陆子鸣在稳住局面的同时，通过细节推断出匪徒的真实目的并非钱财，而是为了逼出一个隐藏多年的冤案真相。时间一分一秒流逝，匪徒的情绪游走在崩溃边缘，陆子鸣必须在上级强攻命令下达前，用语言解开对方的心结，同时揭露被掩盖的黑暗，拯救所有人质，也拯救那个走入绝境的灵魂。",review:"剧情紧凑，几乎全部集中在谈判室内外的对峙，张力十足。男主角与反派之间通过电话展开的智力与心理较量精彩纷呈，台词精炼有力，结局的反转合理且富有深度。",relatedIds:[39,10,84,30,55,34],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:143,cover:"/143.jpg",m3u8Index:2,title:"黑色报告粤语",region:"国产",type:"电影",year:2006,genreRaw:"犯罪 / 惊悚 / 剧情",tags:["国产","电影","犯罪","惊悚","黑帮","卧底","港产"],oneLine:"一名卧底警察在身份暴露边缘，收到一份记录警方内部黑警名单的“黑色报告”。",summary:"香港回归前夕，黑帮势力错综复杂。卧底警察阿仁潜伏在黑帮头目兴叔身边多年，深受信任。一次意外，他截获一份名为“黑色报告”的加密档案，里面详细记录了警方高层与黑帮勾结的人员名单和罪证。与此同时，警方内部开始调查疑似泄密的“鬼”，矛头隐隐指向阿仁。他陷入两难：将报告交给上级，可能正中黑警下怀；藏匿报告，则坐实叛徒嫌疑。在黑白两道的同时追杀下，阿仁只能与一位身份神秘的退役女警官联手，在期限之内，将这份足以引发警界地震的“黑色报告”公之于众。",review:"影片充满经典港产犯罪片的冷峻风格，氛围压抑紧张，悬念设置巧妙。卧底的心理挣扎刻画深刻，动作场面干净利落，是部质量上乘的怀旧风犯罪片。",relatedIds:[33,88,98,75,19,84],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:144,cover:"/144.jpg",m3u8Index:3,title:"枪神史丹比特",region:"欧美",type:"电影",year:2017,genreRaw:"动作 / 西部 / 剧情",tags:["欧美","电影","西部","动作","复仇","枪手传奇"],oneLine:"传奇快枪手退隐多年后，为保护小镇居民，不得不再次拿起左轮手枪。",summary:"史丹比特曾是西部赫赫有名的“枪神”，因厌倦杀戮而隐姓埋名，在一个偏远小镇做铁匠。然而，平静被打破，贪婪的铁路大亨企图强占小镇土地，派来凶残的枪手团进行恐吓。镇民们绝望之际，发现了史丹比特的真实身份，恳求他出手。史丹比特本想拒绝，但当他目睹好友被杀、小镇教堂被焚时，封存的过往与怒火一同苏醒。他不再年轻，枪法却依旧如神。他并非为了荣耀，而是为了守护最后的家园。在一场经典的西部对决中，史丹比特用智慧和技艺，对抗庞大的资本与暴力，书写了传奇的最后一章。",review:"影片重塑了西部片的经典元素，风格粗粝而浪漫。男主角塑造了一个有血有肉、背负过去的英雄形象，枪战场面设计极具仪式感和张力，情怀与动作俱佳。",relatedIds:[13,10,4,57,11,83],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:145,cover:"/145.jpg",m3u8Index:4,title:"公众之敌",region:"欧美",type:"电影",year:2011,genreRaw:"剧情 / 惊悚 / 犯罪",tags:["欧美","电影","犯罪","惊悚","媒体","道德"],oneLine:"一桩残忍凶案发生后，急于求成的媒体将无辜者塑造成“公众之敌”的故事。",summary:"小镇发生灭门惨案，举国震惊。野心勃勃的新闻制片人蕾切尔为了收视率，不顾职业道德，在证据不足的情况下，利用舆论引导，将矛头指向了受害者一家沉默寡言的邻居——患有社交障碍的图书管理员艾伦。通过剪辑过的采访、暗示性的报道和网络煽动，艾伦被迅速塑造成一个变态杀手，成为全民唾弃的“公众之敌”。然而，一名坚持调查真相的老警察发现了案件中的疑点。就在艾伦不堪重负濒临崩溃、法院即将开庭之际，真凶意外落网。但被媒体和公众摧毁的生活，该如何挽回？",review:"影片是对“媒体审判”和群体暴力的一次尖锐批判，节奏紧张，观感令人窒息。叙事视角独特，深刻揭示了信息时代下真相的脆弱与人性的盲从，引人深思。",relatedIds:[52,69,64,10,92,59],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:146,cover:"/146.jpg",m3u8Index:5,title:"咸鱼化龙",region:"国产",type:"电影",year:2020,genreRaw:"喜剧 / 励志 / 剧情",tags:["国产","电影","喜剧","励志","小人物","逆袭"],oneLine:"一名浑噩度日的社区工作者，因负责一条老旧街巷的改造而实现自我蜕变。",summary:"绰号“咸鱼”的区文化馆干事刘小跃，被领导“发配”去负责一条即将拆迁的老街“化龙巷”的文化留存工作。他本想敷衍了事，却在与巷子里形形色色的老手艺人（修钟表的、做旗袍的、唱戏的）打交道过程中，被他们对传统的坚守和生活的热情触动。他利用自己擅长的网络传播，为老街和手艺人宣传，意外吸引了一批年轻人。工作遇到了来自开发商和部分居民的重重阻力，刘小跃这条“咸鱼”却第一次有了想赢的冲动。他联合老街居民，策划了一场别开生面的“老街新生”文化活动，不仅保住了老街的部分风貌，也让自己这条“咸鱼”，找到了跃过龙门的价值。",review:"笑中带泪的市井励志故事，人物鲜活接地气。将小人物的逆袭与传统文化的传承主题结合，情感真挚，充满了人间烟火气和积极向上的力量。",relatedIds:[14,39,53,36,99,89],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:147,cover:"/147.jpg",m3u8Index:6,title:"淑女本色",region:"欧美",type:"电影",year:2003,genreRaw:"剧情 / 爱情 / 文艺",tags:["欧美","电影","文艺","爱情","女性","古典"],oneLine:"文艺复兴时期的意大利，一位贵族少女在婚姻、艺术与自由意志间的艰难抉择。",summary:"16世纪的佛罗伦萨，出身贵族的少女伊莎贝拉聪慧过人，热爱绘画，却囿于时代对女性的束缚。父亲为她安排了一桩有利家族的政治婚姻，对方是一位年长但有权势的公爵。婚前，伊莎贝拉结识了为教堂作画的穷画师洛伦佐，被他自由的灵魂和对艺术的理解深深吸引。两人陷入禁忌之恋。伊莎贝拉必须在遵从家族使命、获得世俗安稳，与追随内心激情、拥抱未知风险之间做出选择。她的决定不仅关乎爱情，更关乎一个女性在那个时代能否拥有定义自我人生的权利。影片以华丽的文艺复兴艺术为背景，勾勒出一幅关于女性觉醒的细腻画卷。",review:"影片制作精良，服化道极尽还原历史奢华感。女主角的内心挣扎刻画得深刻动人，叙事优雅古典，探讨的主题跨越时代仍具现实意义，是一部精美的文艺佳作。",relatedIds:[33,78,27,89,35,2],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/86ea18f9954dbaf22eff5e16c41b4a25/manifest/video.m3u8"},{id:148,cover:"/148.jpg",m3u8Index:7,title:"熟男，我爱你",region:"日韩",type:"电影",year:2015,genreRaw:"爱情 / 喜剧 / 剧情",tags:["日韩","电影","爱情","喜剧","大叔萝莉","轻松"],oneLine:"古板严肃的出版社主编，被社里新来的元气实习生打乱了井然有序的人生。",summary:"43岁的出版社主编松本健一，生活一丝不苟，严谨到近乎刻板。社里新来了22岁的实习生佐藤向日葵，她活泼冒失，想法天马行空，总是闯祸，让松本头疼不已。两人因工作被迫搭档，在鸡飞狗跳的相处中，松本死水般的生活被注入色彩，他开始尝试以前绝不会做的事：吃路边摊、看漫画、参加音乐节。而向日葵也从松本身上学到了责任与专注。就在暧昧情愫悄然滋生时，松本前妻回国、向日葵得到海外工作机会等现实问题接踵而至。这对年龄、性格迥异的“搭档”，能否跨越差异，走向彼此？",review:"轻松浪漫的都市爱情喜剧，年龄差设定带来诸多自然笑料。两位主角的互动甜蜜可爱，情感转变细腻可信，观看过程愉快治愈，毫无负担。",relatedIds:[31,24,25,21,3,51],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/2df81e778442675885257ce3e84c7173/manifest/video.m3u8"},{id:149,cover:"/149.jpg",m3u8Index:8,title:"鲍勃·马利：一份爱",region:"欧美",type:"电影",year:2024,genreRaw:"传记 / 音乐 / 剧情",tags:["欧美","电影","传记","音乐","雷鬼","传奇"],oneLine:"聚焦雷鬼乐之父鲍勃·马利生命最后几年，用音乐传递和平与爱的传奇旅程。",summary:"影片聚焦于雷鬼乐巨星鲍勃·马利生命中充满纷争与光辉的晚期。1976年，牙买加大选前夕，政治暴力升级，马利决定举办一场名为“一份爱”的和平音乐会，试图用音乐团结分裂的国家。在此期间，他遭遇枪击受伤，仍坚持完成演出。随后他自我流放至伦敦，并在那里创作出经典专辑《出埃及记》。影片跟随他的巡演旅程，展现他如何将源自牙买加的雷鬼乐推向世界，传递反对种族主义、暴力和贫困的信息。尽管被诊断出癌症，他仍以惊人毅力完成最后巡演，直至1981年英年早逝，留下不朽的音乐遗产和精神力量。",review:"主演神形兼备，表演极具感染力。音乐场景震撼人心，完美再现了马利演出的能量。影片不止于传记，更是一部关于艺术、信仰与行动的颂歌，情感澎湃。",relatedIds:[28,76,43,86,33,2],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/af3d3f3b4940cee04efcd8ff2c9eef0a/manifest/video.m3u8"},{id:150,cover:"/150.jpg",m3u8Index:9,title:"外乡人",region:"国产",type:"电影",year:2013,genreRaw:"剧情 / 家庭 / 社会",tags:["国产","电影","社会","家庭","北漂","现实"],oneLine:"一对农村夫妻在北京打拼二十年，面对城市化进程与家庭代际的冲突与坚守。",summary:"来自河南农村的建国和秀英，上世纪90年代来到北京，从卖菜、打工开始，扎根在城市边缘。二十年过去，他们开了小吃店，儿子小军在北京出生、长大，一口京片子，彻底成了“北京人”。然而，当老家的土地面临征收，父母年迈需要照顾；当北京的城市改造波及他们赖以生存的“城中村”；当儿子高考在即却与他们观念冲突日益加剧……这个“外乡人”家庭面临着前所未有的撕裂与选择。是回到已然陌生的故乡，还是在这座奋斗半生却始终难以真正融入的城市继续坚持？影片通过一个家庭的命运，折射出中国城市化进程中一代人的漂泊与根系。",review:"影片充满现实主义的力度，细节真实感人。演员表演朴实无华，深刻刻画了普通劳动者在时代变迁中的坚韧、无奈与尊严，是一部有温度、有厚度的诚意之作。",relatedIds:[96,100,37,65,14,80],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"}],Jd=fu;function eh({video:s,size:e="normal"}){const t={large:"aspect-video",normal:"aspect-[3/4]",small:"aspect-square"};return g.jsxs("a",{href:`#/video/${s.id}`,className:"group block bg-gray-800 rounded-lg overflow-hidden shadow-lg hover:shadow-2xl hover:shadow-amber-900/30 transition-all duration-300 hover:-translate-y-1",children:[g.jsxs("div",{className:`relative ${t[e]} overflow-hidden bg-gray-900`,children:[g.jsx

与灾难竞速。一路上，他遇到了自发组织救援的平民车队、心怀各异的不同势力，也逐渐揭开了这场灾难背后可能隐藏的人为秘密。在生死时速中，韩冲不仅要战胜危险的路况，更要直面自己的心魔，完成一场关于救赎与希望的终极飞驰。",review:"影片将赛车题材与灾难片完美融合，紧张刺激的追车戏码贯穿始终，城市崩塌的视觉奇观令人窒息。主角的成长弧光清晰，从逃避到肩负重任的转变充满力量。故事节奏紧凑，毫无尿点，最后的“一路向前”不仅是物理上的冲刺，更是精神上的升华。",relatedIds:[40,51,38,28,79,78],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:3,cover:"/3.jpg",m3u8Index:2,title:"堪萨斯",region:"欧美",type:"电影",year:2019,genreRaw:"西部 / 剧情 / 犯罪",tags:["欧美","电影","西部","剧情","犯罪","复仇","救赎"],oneLine:"一名退役神枪手回到故乡堪萨斯，却发现整个小镇笼罩在腐败与恐惧之中。",summary:"南北战争结束十年后，身心俱疲的前神枪手埃利斯·摩根回到了他位于堪萨斯平原的故乡小镇，只想平静度过余生。然而，他发现小镇已被昔日的战友、现如今的恶霸警长科尔顿及其帮派控制，镇民生活在高压与恐惧之下。埃利斯本想置身事外，直到他收留的一名孤儿因目睹帮派的罪行而遭追杀。为了保护无辜者，也为了替被逼自杀的老镇长讨回公道，埃利斯不得不再次拿起枪。他联合了被压迫的农场主、神秘的印第安向导以及一名良心未泯的帮派成员，策划了一场惊心动魄的对抗。最终，在一场席卷全镇的沙尘暴中，正义与邪恶展开了宿命般的对决。",review:"一部充满古典气质的现代西部片，广袤荒凉的堪萨斯风光极具压迫感。人物塑造立体，主角的沉默与爆发都极具张力。叙事沉稳有力，将个人救赎与社区反抗的主题结合得恰到好处，枪战场面设计简洁而富有冲击力。",relatedIds:[65,23,100,83,70,26],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:4,cover:"/4.jpg",m3u8Index:3,title:"CLASSIC★STARS–古典乐★之星",region:"日韩",type:"电影",year:2022,genreRaw:"音乐 / 校园 / 青春",tags:["日韩","电影","音乐","校园","青春","古典乐","励志"],oneLine:"一群被边缘化的高中生，用颠覆传统的古典乐演出挑战校园权威与偏见。",summary:"在日本一所崇尚学业与体育的精英高中，古典音乐社是即将被废部的“吊车尾”社团。社长天宫奏，一个钢琴天才却患有严重舞台恐惧症；新转学来的小提琴手九条响，性格孤傲，因过去的争议事件而被排斥；还有吹双簧管的搞笑担当、拉大提琴的胆小学妹等。他们为了保住社团，决定参加全国高中生古典音乐大赛。然而，他们的指导老师却要求他们严格按照经典曲谱演奏。深受现代音乐影响的九条响提出大胆想法：将电子乐、嘻哈节奏融入古典名曲，进行颠覆性改编。一群年轻人开始了秘密的“革命性”练习，在传统与创新、规则与突破之间挣扎，最终用一场前所未有的“古典乐★之星”演出，震撼了所有人，也找到了属于自己的音乐与青春定义。",review:"影片充满了青春的躁动与音乐的激情，古典乐与流行元素的碰撞令人耳目一新。每个角色都有鲜明的个性和成长轨迹，团队从散漫到凝聚的过程感人至深。演出场面华丽热血，完美诠释了“破格”的魅力与价值。",relatedIds:[10,82,33,19,61,68],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:5,cover:"/5.jpg",m3u8Index:4,title:"绽放的带刺玫瑰",region:"国产",type:"电影",year:2023,genreRaw:"悬疑 / 犯罪 / 女性",tags:["国产","电影","悬疑","犯罪","女性","复仇","反转"],oneLine:"三位背景迥异的女性因一桩旧案结成同盟，向权贵阶层发起精密复仇。",summary:"冷静睿智的律师林薇、身手不凡的保镖沈青、拥有庞大信息网的咖啡馆老板苏曼，三个看似毫无交集的女性，因十五年前一桩被掩盖的校园霸凌致死案联系在一起——她们分别是案件的旁观者、受害者的姐姐和暗中调查的记者。如今，当年的加害者们已成为社会名流。她们决定不再等待正义，而是组成“玫瑰同盟”，利用各自的专业所长，策划一场跨越数月的精密复仇。每一步都如玫瑰绽放般优雅从容，每一步也都暗藏尖刺，直指仇人的事业、家庭与名誉。然而，随着计划推进，她们发现当年的真相远比已知的更加黑暗，而一双来自更高处的眼睛，似乎早已洞悉了她们的一切。",review:"国产女性题材犯罪片的惊喜之作。剧本结构精巧，三条叙事线并行不悖，最终完美收束。三位女主角形象立体，智斗戏码智商在线，复仇过程既爽快又引人深思。多重反转设置合理，结局意味深长，留有余韵。",relatedIds:[32,4,39,18,62,8],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:6,cover:"/6.jpg",m3u8Index:5,title:"天堂来的男孩",region:"欧美",type:"电影",year:2021,genreRaw:"奇幻 / 家庭 / 剧情",tags:["欧美","电影","奇幻","家庭","剧情","治愈","天使"],oneLine:"一个声称来自天堂的男孩突然出现，彻底改变了一个颓废作家和破碎社区的生活。",summary:"生活在纽约布鲁克林、陷入创作瓶颈与离婚阴霾的作家托马斯，在某个雨夜于自家门口发现了一个八九岁、衣着单薄却异常干净的亚裔男孩。男孩自称“艾利”，来自“上面的地方”，并准确说出了托马斯内心最深处的痛苦与儿时回忆。托马斯本打算将他交给社会精选机构，但艾利身上散发的宁静与智慧，以及对周围人潜移默化的神奇影响——让暴躁的房东变得温和，让争吵的夫妻重归于好——让托马斯决定暂时收留他。艾利的到来，像一道温暖的光，照亮了托马斯灰暗的生活以及整个面临拆迁的旧社区。然而，一名神秘的社工开始追查艾利的下落，并警告托马斯，艾利的“时间”不多了。托马斯必须在失去与得到之间，学会关于爱与放手的最终课题。",review:"影片叙事舒缓而富有诗意，奇幻设定服务于深刻的情感核心。小男孩的表演纯净动人，与颓废男主的互动充满化学反应。它没有刻意煽情，却用最质朴的方式探讨了治愈、社区与信仰，是一部能温暖人心的影视童话。",relatedIds:[66,16,65,18,64,46],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:7,cover:"/7.jpg",m3u8Index:6,title:"烛光里的微笑",region:"国产",type:"电影",year:2008,genreRaw:"剧情 / 家庭 / 传记",tags:["国产","电影","剧情","家庭","传记","教师","感人"],oneLine:"一位山区女教师用毕生心血，为留守儿童点亮知识与希望的烛光。",summary:"上世纪九十年代，刚从师范毕业的王婉婷主动申请到偏远的大山小学任教。学校条件简陋，学生大多是留守儿童，对外界充满渴望又深感自卑。王老师不仅教授知识，更在生活上无微不至地关怀孩子们，她自创“烛光夜话”，每晚在烛光下为孩子们朗读山外的故事，抚慰他们孤独的心灵。为了留住一个因家庭变故即将辍学的女孩，她无数次家访；为了给孩子们争取一套完整的体育器材，她四处奔走。岁月流逝，青丝变白发，一批又一批的孩子在她的烛光中走出大山，而她则像一根默默燃烧的蜡烛，照亮了别人，耗尽了自己。影片根据真实人物事迹改编，歌颂了平凡教育者不平凡的奉献精神。",review:"一部朴实无华却感人至深的作品。女主角的表演内敛而充满力量，将乡村教师的坚韧与温柔刻画得入木三分。故事没有刻意制造戏剧冲突，而是通过日常细节的累积，让情感自然流淌，烛光的意象贯穿全片，温暖而富有象征意义。",relatedIds:[55,12,46,71,4,9],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/86ea18f9954dbaf22eff5e16c41b4a25/manifest/video.m3u8"},{id:8,cover:"/8.jpg",m3u8Index:7,title:"铸剑",region:"国产",type:"电影",year:2016,genreRaw:"武侠 / 历史 / 剧情",tags:["国产","电影","武侠","历史","剧情","工匠精神","复仇"],oneLine:"乱世中，传奇铸剑师为兑现承诺，以身祭炉，锻造出一柄决定王朝命运的神剑。",summary:"五代十国，天下纷争。天下第一铸剑师干将的传人——性格孤僻的剑师墨阳，隐居深山，立誓不再为杀戮铸剑。然而，后周皇室后裔赵胤携其祖父与干将的契约寻来，要求墨阳履行先人之约，铸造能定鼎天下的“龙渊剑”。与此同时，北方契丹贵胄也以武力胁迫，欲夺剑以壮军威。墨阳在承诺、威胁与内心准则间痛苦挣扎。为保护无辜村民，也为终结这因剑而起的无尽争夺，他最终决定开炉。熔炼过程中，他发现龙渊剑的最终铸成，需要铸剑师以血肉之躯献祭。城破之日，剑成之时，墨阳跃入熊熊炉火，一柄光华内敛、却蕴藏着无上威严与悲悯的宝剑横空出世，它的归属，将决定一个时代的走向。",review:"影片极具东方美学意蕴，铸剑过程拍得如仪式般庄重神圣。将武侠、历史与工匠精神相结合，探讨了技艺、道义与牺牲的深刻命题。画面古朴大气，动作设计写意而非写实，结局悲壮而富有史诗感，令人回味无穷。",relatedIds:[71,94,80,16,17,50],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/2df81e778442675885257ce3e84c7173/manifest/video.m3u8"},{id:9,cover:"/9.jpg",m3u8Index:8,title:"虹猫蓝兔海底历险记",region:"国产",type:"电影",year:2012,genreRaw:"动画 / 奇幻 / 冒险",tags:["国产","电影","动画","奇幻","冒险","合家欢","海底世界"],oneLine:"虹猫蓝兔为寻找救治森林的七彩珊瑚，潜入神秘深海，遭遇奇异生物和远古危机。",summary:"美丽的森林突然被奇怪的灰斑病侵袭，树木枯萎。神医逗逗诊断，只有深海之渊的“七彩珊瑚”才能根治此病。虹猫蓝兔勇敢承担起寻找珊瑚的重任，与伙伴们乘坐“麒麟号”潜艇潜入未知的深海世界。他们遇到了友善但健忘的发光水母群、热情好客的海马家族，也遭遇了凶猛的电鳗和狡猾的巨型章鱼。在古老的海底遗迹，他们发现了灰斑病的源头——一个因人类沉船泄漏而苏醒的古代污染源。最终，虹猫蓝兔不仅需要取得七彩珊瑚，更要联合所有海洋朋友，启动遗迹中的净化装置，彻底消除污染威胁，让森林与海洋重现生机。",review:"制作精良的国产动画大电影，海底场景想象力丰富，色彩绚丽，奇妙的海洋生物设计充满童趣。故事寓教于乐，在冒险中传递了环保与友谊的主题。角色性格鲜明，动作场面流畅热闹，非常适合全家一同观看。",relatedIds:[3,69,77,44,74,65],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/af3d3f3b4940cee04efcd8ff2c9eef0a/manifest/video.m3u8"},{id:10,cover:"/10.jpg",m3u8Index:9,title:"超神学院第一季",region:"国产",type:"电影",year:2025,genreRaw:"动画 / 科幻 / 动作",tags:["国产","电影","动画","科幻","动作","超级英雄","校园"],oneLine:"一群拥有超能力的问题少年被集中训练，以应对即将降临地球的外星威胁。",summary:"近未来，全球各地陆续出现拥有奇异能力的青少年，他们被称为“超常觉醒者”，但大多因无法控制力量或被社会排斥而成为问题人物。为应对来自深空的神秘信号预警，一个名为“超神学院”的秘密机构成立，旨在招募并训练这些少年，将其转化为守护地球的力量。叛逆不羁的控火者“炎罗”、内向敏感的意念控物少女“星瞳”、能硬化皮肤的憨厚少年“磐石”等性格迥异、能力不同的少年被强制送入学院。在严苛而古怪的教官指导下，他们不仅要学习控制与开发超能力，更要学会团队合作，克服彼此的矛盾与心结。而学院深处，关于外星威胁的真相以及他们自身能力的起源，却隐藏着更大的秘密。",review:"世界观设定宏大，将校园日常与科幻战斗巧妙结合。角色群像刻画成功，每个主要角色都有独立的成长线。动画制作水准上乘，超能力战斗场面绚丽且富有创意。剧情张弛有度，既有轻松搞笑的生活片段，也有紧张刺激的生死考验，悬念设置引人入胜。",relatedIds:[19,30,34,66,28,56],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/60b4ddb3d166e1239abfc7adf611a6a3/manifest/video.m3u8"},{id:11,cover:"/11.jpg",m3u8Index:10,title:"她和她的他们",region:"日韩",type:"电影",year:2020,genreRaw:"爱情 / 剧情 / 同性",tags:["日韩","电影","爱情","剧情","同性","女性","成长"],oneLine:"一位小说家在回忆与现实中穿梭，梳理她与生命中两个重要“他”的复杂情感纠葛。",summary:"知名女性小说家瑞希在出版自传体小说前夕，回到家乡小镇整理旧物，往事如潮水般涌来。高中时期，她与温柔体贴的学长俊介互生情愫，那段纯净而克制的初恋因俊介举家搬迁无疾而终，却成为她心底的白月光。大学时期，她遇见了才华横溢、张扬不羁的画家隆也，两人陷入一段热烈而痛苦的爱情，在激情与伤害中彼此消耗，最终分手。如今，已成为植物学家的俊介偶然读到她的书稿，重新出现在她的生活中；而隆也则以一场备受争议的画展再次闯入她的视野。瑞希必须在过去的影子和现实的微光中，厘清自己真正的情感归属，完成与自我、与过去的和解。",review:"影片风格细腻唯美，叙事舒缓如散文诗，通过大量闪回与现实交织，细腻刻画了女性复杂幽微的内心世界。两位男性角色的塑造避免了脸谱化，代表了爱情的不同面向。情感刻画真实而克制，没有狗血桥段，却能深深触动观众心弦。",relatedIds:[48,9,30,91,82,92],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/a27121d514ff0079e1e81a6678f14e0c/manifest/video.m3u8"},{id:12,cover:"/12.jpg",m3u8Index:11,title:"出生被调换不怕全家能读我心",region:"国产",type:"电影",year:2025,genreRaw:"喜剧 / 家庭 / 奇幻",tags:["国产","电影","喜剧","家庭","奇幻","读心术","轻喜"],oneLine:"被医院抱错的女孩意外获得读心术，发现养父母一家竟能听到她的内心吐槽。",summary:"25岁的普通上班族林小雨，偶然发现自己竟然和富家女在医院出生时被抱错。还没等她消化这个惊天秘密，一场意外让她获得了“读心术”的能力。她战战兢兢地回到养父母家，试图观察他们的反应，却震惊地“听”到养父母和弟弟的内心活动：“闺女心里活动咋这么丰富？”“姐姐又在脑补狗血剧了？”“这孩子，心里嘀咕得我脑壳疼。”原来，朴实憨厚的一家人早就知道她非亲生，并且拥有“听见林小雨心声”的家族特异功能，多年来一直默默守护着她。哭笑不得的林小雨，在“毫无隐私”却又充满温暖的家庭氛围中，与亲生父母家庭接触，上演了一幕幕因“心声泄露”而引发的爆笑又感人的亲情喜剧，最终找到了关于“家”的真正定义。",review:"设定新颖有趣，将常见的“抱错”梗与“读心术”结合，碰撞出无数笑料。家庭温情刻画真挚动人，搞笑之余不乏对亲情本质的思考。演员表演自然流畅，特别是家人之间通过“心声”互动的戏份，充满了默契与喜感，是部解压又暖心的合家欢电影。",relatedIds:[77,67,40,34,81,38],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/f0d38b8679a1231eff816a8e04cc1a0c/manifest/video.m3u8"},{id:13,cover:"/13.jpg",m3u8Index:12,title:"野良神OAD",region:"日韩",type:"电影",year:2014,genreRaw:"动画 / 奇幻 / 动作",tags:["日韩","电影","动画","奇幻","动作","神明","冒险"],oneLine:"夜斗与日和接下神秘委托，前往被遗忘的“妖物之乡”解决异变，遭遇最强妖魔。",summary:"作为OAD（原创动画光盘）特别篇，本片讲述了夜斗神与神器雪音、少女一岐日和在日常委托之外的一次特殊冒险。一位即将消失的弱小土地神向夜斗发出求救，称其守护的偏远“妖物之乡”正被恐怖的阴影笼罩，大量无害的小妖物失踪。夜斗为了五香钱（委托费）欣然前往，日和出于好奇与担心也偷偷跟上。他们发现这个与世隔绝的村落里，残留着上古时期人与妖共存的遗迹，而幕后黑手竟是一只因人类遗忘和恐惧而诞生的、近乎概念化的强大“无名之妖”。夜斗与雪音在战斗中遭遇前所未有的危机，日和则凭借其特殊的“半妖”体质，成为与古老妖怪沟通、寻找解决之法的关键。",review:"作为OVA作品，制作质量极高，战斗场面流畅酷炫，远超TV版平均水平。故事独立完整，又丰富了《野良神》的世界观，揭示了神明与妖怪关系的另一面。角色互动依旧诙谐有趣，但主题更加深沉，探讨了“记忆”、“名字”与“存在”的关系，粉丝必看。",relatedIds:[91,60,43,53,12,5],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c66b5309b3b64d15ed856810d6cc0b72/manifest/video.m3u8"},{id:14,cover:"/14.jpg",m3u8Index:13,title:"天地明察",region:"日韩",type:"电影",year:2012,genreRaw:"历史 / 剧情 / 传记",tags:["日韩","电影","历史","剧情","传记","围棋","天文","匠人"],oneLine:"江户时代的围棋棋士，受命挑战修订历法，用一生追求天地至理。",summary:"影片改编自冲方丁同名小说，以真实历史人物安井算哲（涩川春海）为主角。他本是江户幕府第四代将军德川家纲的围棋对手，一名热爱天文的棋士。当时日本使用的宣明历已产生明显误差。安井算哲凭借对星象的长期观测，确信旧历有误，立志编制更精准的新历法。然而，修订历法是关系到国家祭祀、农业生产的重大事件，过程充满来自保守派、学术权威乃至政治斗争的重重阻力。在挚友、妻子的支持下，他花费数十载光阴，游历全国测量纬度，学习东西方天文知识，以围棋棋盘般的缜密思维进行无数次计算。历经失败、质疑与漫长等待，最终在五代将军纲吉的支持下，其编制的“贞享历”得以颁布，开创了日本天文历法的新纪元。",review:"一部沉静而有力的历史人物传记片。展现了在缓慢时代里，一个人如何以近乎偏执的专注，穷尽一生去完成一项伟大事业的动人历程。围棋与天文的对映构思巧妙，演员表演内敛而富有深度，影片洋溢着对知识与真理的纯粹敬意，节奏平缓却自有一股震撼人心的力量。",relatedIds:[79,3,93,84,89,77],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/c99d86ece73a935b77e57d322461ddb5/manifest/video.m3u8"},{id:15,cover:"/15.jpg",m3u8Index:14,title:"史酷比和狂热摔跤：飙车者之咒",region:"欧美",type:"电影",year:2018,genreRaw:"动画 / 喜剧 / 冒险",tags:["欧美","电影","动画","喜剧","冒险","合家欢","神秘事件"],oneLine:"神秘怪物袭击职业摔跤巡回赛，史酷比团队假扮摔跤手深入调查。",summary:"神秘公司接到新委托：在全美巡回的“狂热摔跤联盟”比赛中，接连出现一个被称为“地狱引擎”的幽灵赛车手怪物袭击事件，导致比赛中断，选手恐慌。弗雷德、达芙妮、维尔玛、沙吉和史酷比伪装成一支名叫“神秘击倒手”的摔跤团队混入联盟。沙吉和史酷比意外成为了受欢迎的搞笑摔跤组合。他们在调查中发现，“地狱引擎”似乎与联盟老板试图掩盖的一起旧日赛车事故有关，并且目标直指即将举行的冠军之夜大赛。团队必须一边进行滑稽的摔跤训练和表演，一边在充满肌肉与汗水的后台、炫酷的改装车库以及废弃的赛车场中寻找线索，揭开“诅咒”的真相，阻止一场针对冠军选手的巨大阴谋。",review:"将史酷比经典的神秘调查模式与热血喧闹的职业摔跤、飙车文化结合，产生了奇妙的化学反应。笑点密集，尤其是史酷比和沙吉的摔跤戏份令人捧腹。怪物设计很有创意，剧情简单明快，充满怀旧色彩和动感，是一部轻松愉快的合家欢动画电影。",relatedIds:[96,81,86,38,14,84],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fe0c41d994d01211debb24e84e3384a9/manifest/video.m3u8"},{id:16,cover:"/16.jpg",m3u8Index:15,title:"进击的巨人后篇自由之翼",region:"日韩",type:"电影",year:2015,genreRaw:"动画 / 动作 / 奇幻 / 剧情",tags:["日韩","电影","动画","动作","奇幻","剧情","热血","战争"],oneLine:"调查兵团为夺回玛利亚之墙，发起人类对巨人最大规模的反攻，真相逐步浮现。",summary:"作为TV动画的剧场版总集篇后篇，浓缩了“女巨人夺还战”到“艾伦夺还战”的精华内容。经历了特罗斯特区攻防战的惨烈牺牲后，调查兵团在团长艾尔文的带领下，为践行“自由之翼”的使命，准备发起一场前所未有的壁外远征，目标直指艾伦家的地下室，那里可能藏着巨人与墙壁的终极秘密。然而，潜伏在墙内的巨人智慧体——女巨人阿尼·利昂纳德突然出现并掳走艾伦，导致计划生变。利威尔班与调查兵团主力在巨木之森与城市中，与女巨人展开殊死追击与智斗。与此同时，关于城墙教、中央宪兵团的疑云，以及莱纳、贝尔托特等同期生的真实身份，开始逐渐逼近残酷的真相。",review:"剧场版剪辑紧凑，将多集内容的高潮部分无缝衔接，营造出全程无尿点的紧张感和史诗感。巨人对战场面魄力十足，立体机动装置的运用眼花缭乱。不仅保留了原作深刻的人性挣扎与政治隐喻，更突出了调查兵团为自由献身的悲壮与决绝，视听冲击力极强。",relatedIds:[60,25,11,80,44,63],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/929fdb8e536c1fc43a83b32d1a838547/manifest/video.m3u8"},{id:17,cover:"/17.jpg",m3u8Index:16,title:"上帝之国",region:"欧美",type:"电影",year:2017,genreRaw:"剧情 / 爱情 / 同性",tags:["欧美","电影","剧情","爱情","同性","乡村","治愈"],oneLine:"英格兰约克郡的孤独牧羊人，因一名罗马尼亚移民工人的到来，生活发生彻底改变。",summary:"约翰尼在约克郡荒凉而美丽的牧场上为祖母打理农场，生活单调压抑，他用酒精和随意性关系麻痹自己。直到父亲雇佣了罗马尼亚移民工人格奥尔基前来帮忙。格奥尔基安静、勤劳、善于照料羊群，与暴躁疏离的约翰尼形成鲜明对比。起初约翰尼对格奥尔基充满偏见和刁难，但在日复一日的共同劳作中，他被格奥尔基的温柔、坚韧和对生活的热爱所吸引，两人之间产生了微妙的情愫。这段感情在保守的乡村环境中如同禁忌，同时约翰尼还要面对祖母的健康恶化和自我认同的挣扎。格奥尔基的出现，像一道光照亮了约翰尼灰暗的世界，让他开始学习承担责任，面对真实的自我，并在这片被称为“上帝之国”的土地上，寻找属于他们的小小幸福。",review:"影片风景壮美，情感刻画细腻如绣。两位主角的表演自然真挚，化学反应动人，从对抗到相知相爱的过程缓慢而可信。它不仅是一部同性爱情片，更是一部关于孤独、救赎与在地域文化中寻找自我位置的成长故事，安静而富有力量。",relatedIds:[30,75,55,51,68,83],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/fbc04ae173a0e633458658e80ee78c2a/manifest/video.m3u8"},{id:18,cover:"/18.jpg",m3u8Index:17,title:"大选风暴",region:"欧美",type:"电影",year:2023,genreRaw:"剧情 / 政治 / 惊悚",tags:["欧美","电影","剧情","政治","惊悚","选举","阴谋"],oneLine:"距离总统大选投票仅剩72小时，一则足以颠覆选情的丑闻视频在网络曝光。",summary:"美国大选进入白热化阶段，现任总统与年轻挑战者的民调异常胶着。就在选举日前三天，一家边缘媒体突然爆出一段视频，指控挑战者塞巴斯蒂安·克劳在海外有不当商业交易及私生子，瞬间引爆全球舆论。克劳的竞选团队，由资深幕僚长凯特·李带领，陷入前所未有的危机。他们必须在黄金72小时内，核实视频真伪、控制舆论、安抚盟友、并展开绝地反击。与此同时，白宫内部也有人对现任总统的极端竞选策略产生怀疑。凯特在调查中发现，视频的来源异常神秘，背后似乎有国际黑客组织和国内政治势力的双重操纵。一场关于真相、权力与民主制度的极限博弈，在媒体、网络和密室中疯狂上演。",review:"一部节奏紧张、信息密集的政治惊悚片。完美捕捉了数字时代选举的混乱与速朽感，社交媒体舆论战的表现尤为真实刺骨。剧本扎实，角色在高压下的抉择充满戏剧张力，对政治生态的描绘既写实又充满讽刺，观感令人窒息又欲罢不能。",relatedIds:[59,8,6,26,91,92],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/0ba4f146b0e6ea192526706f495d460f/manifest/video.m3u8"},{id:19,cover:"/19.jpg",m3u8Index:18,title:"第十二个嫌疑犯",region:"日韩",type:"电影",year:2019,genreRaw:"悬疑 / 犯罪 / 剧情",tags:["日韩","电影","悬疑","犯罪","剧情","法庭","反转"],oneLine:"一桩铁证如山的杀人案，因第十一名陪审员坚持疑罪从无，迫使寻找根本不存在的“第十二人”。",summary:"检察官出身的法官金秉浩，负责审理一桩引起公愤的富二代杀人案。所有证据都指向被告，社会舆论要求严惩，十一名陪审员也已达成“有罪”一致。唯独第十一位陪审员，一名退休的老警察姜万锡，以一份被忽略的现场微量纤维证据为由，坚持“合理怀疑”，投下反对票。根据法律，必须十二名陪审员一致通过才能判决。为了让审判继续，控辩双方及法官不得不重新梳理案件，甚至被姜万锡引导着去假设一个可能存在的“第十二个嫌疑犯”——一个完美符合逻辑却没有任何证据证明其存在的神秘人。随着调查深入，案件背后的权力干预、媒体操纵、证人的秘密逐一浮现，而姜万锡执着背后的个人动机，也渐渐揭开。",review:"影片是经典的法庭戏格局，却通过“寻找第十二人”的独特设定，将叙事空间拓展到庭外。节奏层层递进，每一次推理和反转都建立在坚实的细节之上。老戏骨的表演沉稳有力，带领观众一同陷入对司法正义、公众情绪与合理怀疑的深刻思辨。",relatedIds:[10,5,91,81,80,14],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1e53f0e1aef7ec2fb5f30ef5d309d69c/manifest/video.m3u8"},{id:20,cover:"/20.jpg",m3u8Index:19,title:"世界的边缘",region:"欧美",type:"电影",year:2021,genreRaw:"科幻 / 惊悚 / 剧情",tags:["欧美","电影","科幻","惊悚","剧情","孤岛","心理"],oneLine:"一群陌生人醒来发现自己身处神秘孤岛，记忆全失，并被迫参与致命的生存游戏。",summary:"八位身份、年龄、国籍各异的男女，在失去近期记忆的情况下，在一座与世隔绝、风景诡异的岛屿上醒来。他们很快发现，岛上存在着无法逾越的隐形边界，将他们困在有限的区域内。一个冰冷的声音通过广播宣布，他们必须遵守一系列规则，并完成“每日任务”，才能获得生存所需的食物和水。任务起初是心理羞辱和信任考验，随后逐渐升级为要求他们互相伤害甚至“淘汰”他人。在求生的本能与残存道德的拉扯中，这群人结盟、背叛、猜忌，试图找出主办者的身份和目的。然而，随着探索深入，他们发现岛屿本身似乎具有生命，而他们的过去与这场游戏的联系，比想象中更加黑暗。",review:"设定充满悬疑感，孤岛环境塑造出色，营造出无处可逃的压迫氛围。影片着重刻画极端环境下的人性嬗变，角色间的张力十足。科幻设定服务于心理惊悚的核心，结局的反转虽在预料之中，但执行得相当巧妙，引发对科技剧情的思考。",relatedIds:[72,53,56,26,39,38],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/1116997bf50b78f22bbfaced8975a021/manifest/video.m3u8"},{id:21,cover:"/21.jpg",m3u8Index:0,title:"判官王妃不好惹",region:"国产",type:"电影",year:2024,genreRaw:"古装 / 爱情 / 喜剧 / 探案",tags:["国产","电影","古装","爱情","喜剧","探案","甜宠","爽文"],oneLine:"现代女法医穿成古代侯府弃妃，靠专业本领屡破奇案，引得冷面王爷刮目相看。",summary:"顶尖法医苏晚意意外穿越，成为大靖朝靖安侯府里备受冷落的王妃。原主性格懦弱，被侧妃陷害，声名狼藉。苏晚意决定不再隐忍，恰逢京城发生连环诡案，官府束手无策。她凭借现代法医知识和缜密逻辑，从蛛丝马迹中找出真凶，一举成名。皇帝特赐“判官”身份，许她参与刑案调查。在外，她与冷静寡言、却暗地欣赏她的靖安王楚凌渊组成“查案搭档”，屡破奇案；在内，则与宅斗的莺莺燕燕过招，飒爽反击。随着案件深入，他们卷入涉及朝堂的巨大阴谋，两人也从最初的契约合作，发展为彼此信任、生死与共的真情。苏晚意用她的专业与智慧，赢得了尊重、爱情与属于自己的人生。",review:"融合了穿越、探案、甜宠等多种流行元素，节奏轻快，爽点密集。女主角智商全程在线，专业破案的情节写得有模有样，避免了无脑恋爱。男女主角互动从针锋相对到暧昧互宠，感情发展自然有趣，是一部合格的下饭古装轻喜剧。",relatedIds:[91,24,95,19,90,34],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e398cb38b257828eeedbcaa0ae2856da/manifest/video.m3u8"},{id:22,cover:"/22.jpg",m3u8Index:1,title:"帐篷外是欧洲4-南法篇",region:"日韩",type:"电影",year:2023,genreRaw:"纪录片 / 真人秀 / 旅游",tags:["日韩","电影","纪录片","真人秀","旅游","美食","治愈"],oneLine:"两位韩国演员驾驶露营车漫游南法，在普罗旺斯的阳光下体验当地风物与慢生活。",summary:"作为热门旅游真人秀系列的电影版，《帐篷外是欧洲4》聚焦于法国南部。演员柳海真和演员兼歌手李昇基继续他们的露营之旅，驾驶着改造的露营车，从蔚蓝海岸的尼斯出发，深入普罗旺斯地区。影片跟随他们的脚步，邂逅薰衣草田的种植农，学习制作传统香皂；在古老的罗马遗迹旁扎营，享用简单的晚餐；探访当地小镇的周末集市，与热情的摊主交流，购买新鲜食材；在海边悬崖寻找绝佳的垂钓点，并尝试用法式方法烹饪海获。他们没有固定的行程表，随性而走，在星空下畅谈人生，在旅途中体验南法独有的“艺术与生活的融合”哲学，为观众呈现一幅充满阳光、美食、风景与人情味的治愈画卷。",review:"影片延续了系列舒缓、治愈的基调，南法的风光被镜头捕捉得如诗如画。两位主持人的化学反应自然有趣，互动轻松温馨。它不仅仅是一部旅游指南，更是一种生活态度的展示，鼓励观众去发现平凡旅途中的美好与惊喜，减压效果十足。",relatedIds:[9,23,3,77,88,97],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/77ae15566dde5cfb920bae4712a38399/manifest/video.m3u8"},{id:23,cover:"/23.jpg",m3u8Index:2,title:"阿丽尼餐厅入驻马德里",region:"欧美",type:"电影",year:2022,genreRaw:"剧情 / 美食",tags:["欧美","电影","剧情","美食","家庭","文化冲突","奋斗"],oneLine:"一个希腊移民家庭将家族餐厅开到马德里，在坚守传统与适应新环境中挣扎前行。",summary:"希腊厨师尼科斯与妻子艾琳娜在雅典经营着一家备受好评的家庭餐厅“阿丽尼”。为了给子女更好的未来和拓展事业，他们做出了大胆决定：举家迁往西班牙马德里，开设分店。然而，在马德里的美食竞技场立足远比想象中艰难。他们需要适应新的食材供应链、复杂的当地法规，以及马德里人对希腊菜相对陌生的口味。大女儿索菲亚努力融入新学校，小儿子迪米特里思乡情切。尼科斯坚持原汁原味的家族秘方，却遭遇冷遇；艾琳娜则尝试融合西班牙元素进行创新，引发夫妻矛盾。餐厅经营陷入困境时，一次偶然的机会，他们用一道改良后的“希腊-西班牙tapas”打动了苛刻的美食评论家。最终，阿丽尼餐厅找到了自己的独特定位：不是纯粹的希腊菜，而是一个关于迁徙、融合与家庭之爱的美味故事。",review:"一部温暖真挚的美食剧情片。影片对美食的刻画令人垂涎，更将食物的味道与移民家庭的酸甜苦辣紧密相连。文化冲突与融合的主题处理得细腻而不说教，家庭成员间的互动真实动人。它歌颂了传统，也拥抱了改变，结局充满希望与温情。",relatedIds:[29,87,15,77,33,36],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/41cb67b47a3668efaea014219666e659/manifest/video.m3u8"},{id:24,cover:"/24.jpg",m3u8Index:3,title:"翠狐戏夫",region:"国产",type:"电影",year:2021,genreRaw:"古装奇幻 / 爱情喜剧",tags:["国产","电影","古装","奇幻","爱情","喜剧","狐狸精","轻喜"],oneLine:"渡劫失败的千年翠狐，为报恩嫁给呆萌书生，上演一段啼笑皆非的“仙凡”婚姻。",summary:"千年翠狐小翠在渡劫时遭遇雷击重伤，幸得进京赶考的穷书生柳文清所救。为报救命之恩并借助书生身上的文曲星气息疗伤，小翠化身美貌少女，设计嫁入柳家。婚后，她运用法术帮丈夫解决生活难题、智斗恶霸，却也因不懂人间规矩闹出诸多笑话。两人在日常磨合中渐生真情，然而小翠的妖族身份引来了捉妖师的追捕，同时柳文清的科举之路也危机四伏。当爱情与生存面临抉择，小翠必须在暴露身份拯救丈夫与悄然离去保他平安之间做出选择。",review:"影片将古典狐妖传说与现代喜剧元素巧妙融合，节奏明快，笑点自然。女主既灵动又痴情的人设非常讨喜，与书生丈夫的互动充满反差萌。结局的处理温暖而富有新意，超越了简单的报恩主题，探讨了真正的陪伴与成长。",relatedIds:[27,62,86,60,87,81],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/31227358d3c181b7168e28ad248cfb4e/manifest/video.m3u8"},{id:25,cover:"/25.jpg",m3u8Index:4,title:"花束般的恋爱",region:"日韩",type:"电影",year:2016,genreRaw:"都市爱情 / 文艺剧情",tags:["日韩","电影","爱情","文艺","剧情","成长","催泪"],oneLine:"两个灵魂百分百契合的恋人，从如鲜花盛开般的热恋，走到枯萎分手的五年情感纪实。",summary:"山音麦和八谷绢因错过末班车而相遇，他们惊讶地发现彼此喜欢相同的作家、电影和音乐，甚至连穿帆布鞋的方式都一样，仿佛是世界上的另一个自己。他们迅速坠入爱河，在出租屋里分享着每一刻的甜蜜。然而，随着大学毕业步入社会，现实的重量逐渐压垮了浪漫。麦为了生计从事不喜欢的销售工作，绢则在职场中挣扎。曾经同步的步调开始错位，分享欲被疲惫取代。影片细致描绘了两人从热恋、同居、矛盾到最终平静分手的五年时光，如同一束鲜花从绚烂绽放到慢慢枯萎的过程。",review:"电影以极其真实细腻的笔触，刻画了爱情从发生到消逝的完整过程，共鸣感极强。节奏舒缓如散文，对生活细节的捕捉精准到令人心痛。它没有狗血冲突，却用日常的琐碎和沉默，道出了无数都市男女爱情的本质。",relatedIds:[3,94,38,69,84,53],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/d0af4221b8947fda8c23f4955947cb58/manifest/video.m3u8"},{id:26,cover:"/26.jpg",m3u8Index:5,title:"她从火光中来",region:"国产",type:"电影",year:2023,genreRaw:"都市情感 / 职业剧情",tags:["国产","电影","消防员","舞蹈家","救赎","励志","情感"],oneLine:"因火灾失去一切的芭蕾舞者，被救她的消防员点亮重生之路，两人在灰烬中寻找希望。",summary:"顶尖芭蕾舞者林晚在剧院大火中身受重伤，职业生涯戛然而止，更因吸入性损伤导致心理创伤，无法再面对舞台。将她从火场中抱出的消防中队长江焰，目睹了她眼中的绝望。在漫长的康复期，江焰以笨拙却坚定的方式接近林晚，带她接触消防队的生活，感受平凡却炽热的生命力。林晚从抗拒到逐渐打开心扉，并在帮助消防队进行艺术辅导的过程中，找到了舞蹈的另一种意义。当她终于鼓起勇气编创一支关于“重生”的舞蹈时，江焰却在一场危险的救援中失联。火光，再次成为他们共同的考验。",review:"题材新颖，将消防员的英勇与艺术家的脆弱结合得恰到好处。情感铺垫细腻，从救命到救心，层层递进。男女主角的表演极具张力，化学反应感人。影片对创伤后成长的主题刻画深刻，充满力量与温暖。",relatedIds:[44,10,56,54,18,89],videoUrl:"https://customer-7t103rn8rocxo5v6.cloudflarestream.com/e70b98acb53eb889d108057988609efb/manifest/video.m3u8"},{id:27,cover:"/27.jpg",m3u8Index:6,title:"魔鬼保姆
